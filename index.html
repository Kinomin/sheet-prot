<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>席メイト（β版）</title>
<style>
:root{
  --ink:#161d29; --ink2:#4a5972; --ink3:#7c8aa3;
  --line:#d7dde8; --line2:#eaeef5;
  --paper:#f4f6fa; --card:#ffffff;
  --indigo:#20509b; --indigo-d:#173c76; --indigo-t:#e9eefa;
  --vermilion:#bb3c26; --vermilion-t:#fbeae6;
  --moss:#46714f; --moss-t:#e9f2ea;
  --grid:#dfe6f2;
  --amber:#a86a12; --amber-t:#fbf1de;
  --r:10px;
  --jp:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","YuGothic","Noto Sans JP","Meiryo",sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Menlo","Consolas",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--jp); color:var(--ink); background:var(--paper);
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2.5px solid var(--indigo);outline-offset:2px;border-radius:4px}

/* ---------- 共通パーツ ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  min-height:44px;padding:0 18px;border-radius:var(--r);
  border:1.5px solid var(--line);background:var(--card);
  font-weight:600;font-size:14.5px;transition:.12s;white-space:nowrap;
}
.btn:hover:not(:disabled){border-color:var(--ink3);background:#fbfcfe}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn-primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--indigo-d);border-color:var(--indigo-d)}
.btn-danger{color:var(--vermilion);border-color:#e8c4bc}
.btn-danger:hover:not(:disabled){background:var(--vermilion-t);border-color:var(--vermilion)}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:7px}
.btn-lg{min-height:52px;padding:0 26px;font-size:16px}
.btn.on{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.on:hover{background:#8f590f;border-color:#8f590f}

.field{display:block;margin-bottom:14px}
.field > span{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px;letter-spacing:.02em}
.input,select.input{
  width:100%;min-height:42px;padding:0 12px;border:1.5px solid var(--line);
  border-radius:8px;background:var(--card);
}
.input:focus{border-color:var(--indigo);outline:none;box-shadow:0 0 0 3px var(--indigo-t)}
select.input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.chip-i{background:var(--indigo-t);color:var(--indigo-d)}
.chip-v{background:var(--vermilion-t);color:var(--vermilion)}
.chip-m{background:var(--moss-t);color:var(--moss)}
.chip-a{background:var(--amber-t);color:var(--amber)}
.chip-g{background:#eef1f6;color:var(--ink2)}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{padding:0 16px;min-height:40px;font-size:14px;font-weight:600;color:var(--ink2);border-right:1.5px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed="true"]{background:var(--indigo);color:#fff}

/* ---------- アプリ骨格 ---------- */
#app{height:100%;display:flex;flex-direction:column}
.topbar{
  flex:0 0 auto;height:58px;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:var(--card);border-bottom:1.5px solid var(--line);
}
/* パンくずが伸びる画面（編集画面）では上部バーの幅が足りなくなる。
   縮めてよいのは横スクロールできるパンくず側で、アプリ名は
   「席メ／イト」のように途中で折り返させない。 */
.brand{display:flex;align-items:baseline;gap:9px;font-weight:800;letter-spacing:.01em;
  flex:0 0 auto;white-space:nowrap}
.brand .mark{
  width:26px;height:26px;border-radius:6px;background:var(--indigo);position:relative;flex:0 0 auto;
  align-self:center;
  background-image:linear-gradient(#fff 1.5px,transparent 1.5px),linear-gradient(90deg,#fff 1.5px,transparent 1.5px);
  background-size:8.5px 8.5px;background-position:4px 4px;
}
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink2);min-width:0}
.crumb b{color:var(--ink);font-weight:700}
.crumb .sep{color:var(--ink3)}
.spacer{flex:1}
.view{flex:1;min-height:0;overflow:auto}
.wrap{max-width:1080px;margin:0 auto;padding:30px 24px 70px}

/* ---------- ホーム ---------- */
.home-hero{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.home-hero h1{font-size:27px;font-weight:800;letter-spacing:.01em;line-height:1.3}
.home-hero p{color:var(--ink2);font-size:13.5px;margin-top:3px}
.searchbar{position:relative;flex:1;min-width:230px}
.searchbar input{padding-left:38px}
.searchbar::before{content:"";position:absolute;left:14px;top:14px;width:11px;height:11px;border:2px solid var(--ink3);border-radius:50%}
.searchbar::after{content:"";position:absolute;left:23px;top:24px;width:7px;height:2px;background:var(--ink3);transform:rotate(45deg)}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(266px,1fr));gap:15px}
.tcard{
  position:relative;text-align:left;padding:17px 18px 15px;border:1.5px solid var(--line);
  border-radius:14px;background:var(--card);transition:.14s;display:block;width:100%;
}
.tcard:hover{border-color:var(--indigo);box-shadow:0 6px 20px -10px rgba(32,80,155,.4);transform:translateY(-2px)}
.tcard .tk{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:9px}
.tcard h3{font-size:18.5px;font-weight:800;letter-spacing:.01em}
.tcard .sub{font-size:13px;color:var(--ink2);margin-top:1px}
.tcard .mini{
  margin:12px 0 11px;height:74px;border:1px solid var(--line2);border-radius:8px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:11px 11px;display:grid;gap:3px;padding:8px;place-content:center;
}
.tcard .mini i{background:var(--indigo);opacity:.55;border-radius:1.5px;display:block}
.tcard .meta{display:flex;gap:14px;font-size:11.5px;color:var(--ink3);font-family:var(--mono);border-top:1px solid var(--line2);padding-top:10px}
.tcard .meta b{color:var(--ink2)}
.tcard-new{
  border-style:dashed;border-width:2px;border-color:var(--line);background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:210px;
  font-weight:700;color:var(--ink2);
}
.tcard-new:hover{border-color:var(--indigo);color:var(--indigo);background:var(--indigo-t);transform:none;box-shadow:none}
.tcard-new .plus{font-size:26px;line-height:1;font-weight:400}

.empty{text-align:center;padding:60px 20px;color:var(--ink2)}
/* 1件もないときの案内 */
.firstrun{
  border:2px dashed var(--line);border-radius:16px;background:var(--card);
  padding:36px 30px;text-align:center;max-width:620px;margin:0 auto;
}
.firstrun h3{font-size:19px;font-weight:800;margin-bottom:9px}
.firstrun > p{color:var(--ink2);font-size:14px;line-height:1.8;margin-bottom:20px}
.firstrun-steps{
  list-style:none;counter-reset:s;text-align:left;max-width:430px;margin:0 auto 24px;
  display:flex;flex-direction:column;gap:11px;
}
.firstrun-steps li{
  counter-increment:s;position:relative;padding-left:34px;
  font-size:13.5px;color:var(--ink2);line-height:1.6;
}
.firstrun-steps li::before{
  content:counter(s);position:absolute;left:0;top:-1px;
  width:23px;height:23px;border-radius:50%;background:var(--indigo);color:#fff;
  font-family:var(--mono);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.empty h3{font-size:17px;margin-bottom:6px;color:var(--ink)}

/* ---------- テンプレート詳細 ---------- */
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--line);margin:18px 0 22px;overflow-x:auto}
.tabs button{
  padding:11px 17px;font-weight:700;font-size:14.5px;color:var(--ink3);
  border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap;
}
.tabs button[aria-selected="true"]{color:var(--indigo);border-bottom-color:var(--indigo)}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.box{border:1.5px solid var(--line);border-radius:13px;background:var(--card);padding:19px}
.box > h3{font-size:15px;font-weight:800;margin-bottom:3px}
.box > .hint{font-size:12.5px;color:var(--ink3);margin-bottom:14px;line-height:1.5}

table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{
  text-align:left;font-size:11px;letter-spacing:.1em;color:var(--ink3);font-family:var(--mono);
  font-weight:600;padding:6px 8px;border-bottom:1.5px solid var(--line);text-transform:uppercase;
}
table.tbl td{padding:7px 8px;border-bottom:1px solid var(--line2)}
table.tbl tr:hover td{background:#f8fafd}
.scroller{max-height:340px;overflow:auto;border:1px solid var(--line2);border-radius:9px}

.hist{display:flex;flex-direction:column;gap:9px}
.hrow{
  display:flex;align-items:center;gap:13px;padding:12px 14px;border:1.5px solid var(--line);
  border-radius:11px;background:var(--card);flex-wrap:wrap;
}
.hrow:hover{border-color:var(--indigo)}
.hrow .date{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:-.01em}
.hrow .when{font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.hrow-info{flex:1;min-width:0}
.hrow-main{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.hrow-sub{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin-top:2px}
.hrow-actions{display:flex;gap:7px;flex-wrap:wrap}

/* ---------- 座席表エディタ ---------- */
.ed{display:flex;flex-direction:column;height:100%;min-height:0}
.toolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:10px 16px;
  background:var(--card);border-bottom:1.5px solid var(--line);flex-wrap:wrap;
}
.toolbar .div{width:1px;height:26px;background:var(--line);margin:0 3px}
.tool-note{font-size:12px;color:var(--ink3);font-family:var(--mono)}
.ed-body{flex:1;min-height:0;display:flex}
.canvas-pad{
  flex:1;min-width:0;padding:22px;display:grid;place-items:center;
  container-type:size;background:
    radial-gradient(circle at 1px 1px, #dbe1ec 1px, transparent 0) 0 0/22px 22px;
}
.sheet{
  background:#fff;box-shadow:0 3px 26px -8px rgba(22,29,41,.28);
  border:1px solid var(--line);display:flex;flex-direction:column;
  padding:var(--pad,16px);position:relative;
}
.sheet-head{flex:0 0 auto;display:flex;justify-content:flex-end;margin-bottom:var(--pad,14px)}
.sheet-head .hd{text-align:right;line-height:1.45}
.sheet-head .hd .d{font-family:var(--mono);font-weight:700;font-size:var(--fs-hd,13px)}
.sheet-head .hd .c{font-weight:800;font-size:calc(var(--fs-hd,13px) * 1.16)}
.sheet-head .hd .t{font-size:var(--fs-hd,13px);color:#333}
.room{flex:1;min-height:0;position:relative}
.seatgrid{
  position:absolute;inset:0;display:grid;
  gap:var(--gap,8px);align-content:center;justify-content:center;
}
.seat{
  border:1.5px solid var(--ink);border-radius:4px;background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;text-align:center;padding:1px;
  transition:.1s;width:var(--cw);height:var(--ch);
}
.seat .sname{font-weight:700;font-size:var(--fs-name,14px);line-height:1.15;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;max-width:100%;display:inline-block}
.seat .sromaji{font-family:var(--mono);font-size:var(--fs-sub,8px);color:#555;letter-spacing:.04em;margin-top:1px;
  white-space:nowrap;overflow:hidden;max-width:100%;display:inline-block}
.seat .sno{position:absolute;top:1px;left:3px;font-family:var(--mono);font-size:var(--fs-sub,8px);color:#888}
.seat.empty{border-style:dashed;border-color:#b9c2d2;background:#fdfdfe}
.seat.off{border:1px dashed #dde2ea;background:repeating-linear-gradient(45deg,#f2f4f8,#f2f4f8 4px,#e9edf3 4px,#e9edf3 8px)}
.seat.off *{display:none}
.seat.fixed{box-shadow:inset 0 0 0 2.5px var(--vermilion)}
.seat .stamp{
  position:absolute;top:2px;right:2px;font-size:var(--fs-sub,8px);font-weight:800;
  color:var(--vermilion);border:1.5px solid var(--vermilion);border-radius:3px;padding:0 2px;line-height:1.3;
}
.mode-place .seat,.mode-swap .seat{cursor:pointer}
.mode-place .seat:hover,.mode-swap .seat:hover{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-t)}
/* タブレットでの交換モード操作を想定し、見た目の座席サイズは変えずタップ領域のみ44px以上を確保する */
.mode-swap .seat:not(.off)::after{
  content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:max(100%,44px);height:max(100%,44px);
}
.seat.drop{border-color:var(--indigo);background:var(--indigo-t);box-shadow:0 0 0 3px var(--indigo-t)}
.seat.sel{border-color:var(--amber);box-shadow:0 0 0 3.5px var(--amber-t);background:#fffcf3}
.seat.flash{animation:flash .5s}
@keyframes flash{0%{background:var(--moss-t)}100%{background:#fff}}
.seat[draggable="true"]{cursor:grab}
.seat.dragging{opacity:.35}

.ritem{
  position:absolute;border:1.5px solid var(--ink);border-radius:3px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;
  font-size:var(--fs-room,11px);letter-spacing:.06em;
}
.ritem[data-kind="blackboard"]{background:#2f3b34;color:#fff;border-color:#2f3b34}
.ritem[data-kind="podium"]{background:#f1f3f7}
.ritem[data-kind="in"],.ritem[data-kind="out"]{background:#fff;border-style:dashed}
/* 教室レイアウト編集中は、座席グリッド（.seatgridはinset:0で部屋全体を覆う）が
   下にある備品のクリックを奪ってしまうため、グリッド側の当たり判定を無効にする */
.mode-room .seatgrid{pointer-events:none}
.mode-room .ritem{cursor:move;box-shadow:0 0 0 2px var(--indigo-t);z-index:5}
.mode-room .ritem:hover{border-color:var(--indigo)}
.ritem .x{
  position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;
  background:var(--vermilion);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;line-height:1;
}
.mode-room .ritem .x{display:flex}

/* ---------- 名前カード ---------- */
.side{
  flex:0 0 300px;border-left:1.5px solid var(--line);background:var(--card);
  display:flex;flex-direction:column;min-height:0;
}
.side-head{flex:0 0 auto;padding:14px 15px 11px;border-bottom:1.5px solid var(--line2)}
.side-head .r1{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.side-head h3{font-size:14.5px;font-weight:800}
.side-head .cnt{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.side-head label.tog{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);margin-top:9px;cursor:pointer;font-weight:600}
.cards{flex:1;min-height:0;overflow-y:auto;padding:11px 15px 30px;display:flex;flex-direction:column;gap:7px}
.card{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border:1.5px solid var(--line);
  border-radius:9px;background:var(--card);cursor:grab;transition:.1s;
}
.card:hover{border-color:var(--indigo);background:var(--indigo-t)}
.card.dragging{opacity:.4}
.card.placed{opacity:.42;background:#f7f9fc}
.card .no{font-family:var(--mono);font-size:12px;color:var(--ink3);width:22px;text-align:right;flex:0 0 auto}
.card .nm{font-weight:700;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .g{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.card .g.m{background:var(--indigo)} .card .g.f{background:var(--vermilion)}

/* ---------- ログイン ---------- */
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 18px 48px}
.login-card{
  width:100%;max-width:470px;background:var(--card);border:1.5px solid var(--line);
  border-radius:18px;padding:28px 26px 24px;box-shadow:0 18px 50px -26px rgba(22,29,41,.4);
}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.login-brand b{font-size:17px;font-weight:800;letter-spacing:.01em}
.login-brand .mark{width:34px;height:34px;border-radius:8px;background-size:11px 11px;background-position:5px 5px}
.login-sub{font-size:12.5px;color:var(--ink3);margin-top:2px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:16px}
.plan{
  text-align:left;padding:14px 14px 12px;border:2px solid var(--line);border-radius:13px;
  background:var(--card);transition:.13s;
}
.plan:hover{border-color:var(--ink3)}
.plan.on{border-color:var(--indigo);background:var(--indigo-t);box-shadow:0 0 0 3px var(--indigo-t)}
.plan-h{display:flex;flex-direction:column;gap:2px;margin-bottom:9px}
.plan-h b{font-size:14.5px;font-weight:800}
.plan-price{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--indigo)}
.plan.on .plan-price{color:var(--indigo-d)}
.plan-ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.plan-ul li{font-size:11.5px;color:var(--ink2);line-height:1.45;padding-left:12px;position:relative}
.plan-ul li::before{content:"✓";position:absolute;left:0;color:var(--moss);font-weight:800}
.login-note{font-size:12.5px;color:var(--ink2);margin-bottom:16px;min-height:18px}
.gbtn-slot{display:flex;flex-direction:column;align-items:center;gap:10px;min-height:44px}
.login-hint{font-size:11.5px;color:var(--ink3);line-height:1.55;text-align:center}
.login-hint code,.alert code,.note code{font-family:var(--mono);font-size:.92em;background:#eef1f6;padding:1px 4px;border-radius:3px}
.login-legal{margin-top:14px;font-size:11.5px;color:var(--ink3);text-align:center;line-height:1.7}
.login-legal .link{font-size:11.5px}
/* Googleログインボタン（公式ガイドラインに沿った白背景＋Gマーク） */
.gbtn{
  display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
  min-height:48px;padding:0 18px;border:1.5px solid #dadce0;border-radius:99px;
  background:#fff;color:#3c4043;font-size:15px;font-weight:700;transition:.12s;
}
.gbtn:hover:not(:disabled){background:#f8f9fa;border-color:#c9ced6;box-shadow:0 1px 3px rgba(60,64,67,.2)}
.gbtn:disabled{opacity:.6;cursor:not-allowed}
.gbtn-ic{display:flex;align-items:center;flex:0 0 auto}
.link{
  background:none;border:none;padding:0;font-size:13.5px;font-weight:600;
  color:var(--indigo);text-decoration:underline;text-underline-offset:2px;cursor:pointer;
}
.link:hover{color:var(--indigo-d)}
@media (max-width:420px){ .plans{grid-template-columns:1fr} }

/* ---------- 設定メニュー ---------- */
.gear-wrap{position:relative;flex:0 0 auto}
.gear{
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);
  font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;color:var(--ink2);
}
.gear:hover{border-color:var(--ink3);background:#fbfcfe}
.gear-menu{
  position:absolute;top:46px;right:0;z-index:60;min-width:214px;
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;

@media print{

/* .seatの通常のtransition（画面編集中にウィンドウ幅を変えたときの滑らかな拡縮用）が
   印刷プレビュー／実際の印刷でも働くと、--cw/--chを印刷サイズへ変更した直後に
   fitSeatNames()やavoidRoomOverlaps()が座席の"アニメ移行中サイズ"を読み取ってしまい、
   氏名や教室備品の重なり判定を誤ることがあるため、印刷時は瞬時に切り替える。 */
.print-preview .seat{transition:none}
@media print{ .seat{transition:none} }

function toRomaji(kana){
  if(!kana) return "";
  // 全角カタカナ → ひらがな、空白除去
  let s = kana.replace(/[\u30a1-\u30f6]/g, c=>String.fromCharCode(c.charCodeAt(0)-0x60))
              .replace(/[\s　]/g,"");
  let out="";
  for(let i=0;i<s.length;i++){
    const two=s.slice(i,i+2);
    if(ROMA[two]){out+=ROMA[two];i++;continue}
    const ch=s[i];
    if(ch==="っ"){ // 促音：次の子音を重ねる
      const nx=ROMA[s.slice(i+1,i+3)]||ROMA[s[i+1]]||"";
      out += (nx[0]==="C" ? "T" : (nx[0]||""));
      continue;
    }
    if(ch==="ー"){continue}
    out += ROMA[ch] ?? "";
  }
  return out;
}

}

/* サンプルを入れたかどうかはアカウントごとに覚えておく。
   共用パソコンで先生ごとに1回ずつ用意し、消したあとは復活させない。 */
const SAMPLE_KEY="seat-chart-sample-done";
function sampleDoneList(){
  try{ const v=JSON.parse(localStorage.getItem(SAMPLE_KEY)||"[]"); return Array.isArray(v)?v:[] }
  catch(e){ return null }              // 読めない場合は作らない側に倒す
}
/* サンプルを用意した場合だけ true を返す */
function ensureSampleTemplate(){
  if(!BETA_FREE())return false;
  const owner=currentOwnerId(); if(!owner)return false;
  const done=sampleDoneList();
  if(done===null||done.includes(owner))return false;
  try{ localStorage.setItem(SAMPLE_KEY,JSON.stringify(done.concat(owner))) }
  catch(e){ return false }             // 記録できないなら作らない（毎回増えてしまうため）
  if(store.all().length)return false;  // すでに自分のデータがあるなら触らない
  store.add(makeSampleTemplate());
  return true;
}

/* ---------------- IndexedDB（生API・外部ライブラリ不使用） ---------------- */
const DB_NAME="seat-chart-tool", DB_VERSION=1, DB_STORE="templates";
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=()=>{ req.result.createObjectStore(DB_STORE,{keyPath:"id"}) };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbGetAll(){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,"readonly");
    const req=tx.objectStore(DB_STORE).getAll();
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function idbPut(t){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,"readwrite");
    tx.objectStore(DB_STORE).put(clone(t));
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function idbDelete(id){
  const db=await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(DB_STORE,"readwrite");
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}

/* ---------------- ストア ----------------
   同期API(get/add/save/remove)は画面描画がすべて同期前提のため維持し、
   永続化はIndexedDBへの書き込みスルー（fire-and-forget）で行う。

   ★データはアカウント（Googleアカウントのsub）ごとに分離する★
   職員室の共用パソコンなど1つのブラウザを複数の先生が使う場面で、
   別のアカウントでログインした人に生徒名簿が見えてしまうことを防ぐため、
   テンプレートに ownerId を持たせ、読み込み時に自分のものだけを取り出す。 */
/* ownerIdを持たない旧データを引き取れるのは、この端末で最初にログインした1人だけ。
   戻り値が true のときだけ引き取ってよい。 */
const LEGACY_OWNER_KEY="seat-chart-legacy-owner";
function claimLegacyOwner(owner){
  try{
    const claimed=localStorage.getItem(LEGACY_OWNER_KEY);
    if(!claimed){ localStorage.setItem(LEGACY_OWNER_KEY,owner); return true }
    return claimed===owner;
  }catch(e){ return false }   // localStorageが使えない場合は引き取らない（安全側に倒す）
}

const store={
  data:{templates:[]},
  all(){return this.data.templates},
  get(id){return this.data.templates.find(t=>t.id===id)},
  save(t){
    t.updatedAt=Date.now();
    idbPut(t).catch(()=>toast("保存に失敗しました（ストレージの空き容量をご確認ください）"));
    SYNC.schedule();                       // 同じGoogleアカウントの他の端末へ反映する
  },
  add(t){this.data.templates.unshift(t);this.save(t);return t},
  remove(id){
    this.data.templates=this.data.templates.filter(t=>t.id!==id);
    idbDelete(id).catch(()=>{});
    markDeleted(id);                       // 他の端末でも消えるように記録する
    SYNC.schedule();
  },
  async load(){
    const owner=currentOwnerId();
    this.data.templates=[];
    if(!owner)return;                                   // 未ログイン時は何も読み込まない
    if(typeof indexedDB==="undefined")return;
    try{
      const all=await idbGetAll();
      // ownerId導入前に作られたデータは、最初にログインした人のものとして引き継ぐ。
      // 「今ログインしている人」に無条件で渡すと、職員室の共用パソコンで
      // あとからログインした別の先生に、前の先生の生徒名簿が渡ってしまう。
      const legacy=all.filter(t=>!t.ownerId);
      if(legacy.length&&claimLegacyOwner(owner)){
        legacy.forEach(t=>{t.ownerId=owner});
        await Promise.all(legacy.map(t=>idbPut(t)));
      }
      this.data.templates=all
        .filter(t=>t.ownerId===owner)
        .sort((a,b)=>b.createdAt-a.createdAt);
    }catch(err){ /* 読み込めない場合は空のまま開始する */ }
  }
};

/* 座席表は「開始日の新しい順」で扱う。配列は作成順に積まれるため、
   さかのぼって過去の座席表を作った場合に履歴の並びや「前回」の判定が狂うのを防ぐ。 */
const chartsByDate = t => [...(t.charts||[])].sort((a,b)=>
  String(b.startDate||"").localeCompare(String(a.startDate||""))||(b.createdAt-a.createdAt));
/* その座席表のひとつ前（開始日がより古い直近の座席表）を返す */
const prevChartOf = (t,c) => chartsByDate(t).filter(x=>
  x.id!==c.id && String(x.startDate||"")<=String(c.startDate||""))[0]||null;

const titleOf = t => t.kind==="elective" ? (t.subjectName||"（授業名未設定）") : (t.className||"（クラス名未設定）");
const subOf   = t => t.kind==="elective" ? `担当：${t.teacherName||"—"}` : `担任：${t.teacherName||"—"}`;

/* =====================================================================
   Supabase（認証・会員種別・決済の窓口）
   ---------------------------------------------------------------------
   SDKは使わず、公開されているREST APIをfetchで呼ぶ（依存ライブラリを増やさないため）。

   会員種別(plan)はSupabaseのprofilesテーブルが正であり、
   書き換えられるのはStripeのwebhookを受けるEdge Functionだけ。
   ブラウザ側から plan を更新する経路は列レベル権限で塞いである。
   ===================================================================== */
const SESSION_KEY="seat-chart-session";
const SB={
  session:null,                       // {access_token,refresh_token,expires_at,user,provider_token}
  loadSession(){
    try{ this.session=JSON.parse(localStorage.getItem(SESSION_KEY)||"null") }
    catch(e){ this.session=null }
    return this.session;
  },
  saveSession(s){
    this.session=s;
    try{
      if(s)localStorage.setItem(SESSION_KEY,JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    }catch(e){}
  },
  headers(extra={}){
    return {apikey:APP_CONFIG.supabaseAnonKey,
            Authorization:"Bearer "+(this.session?.access_token||APP_CONFIG.supabaseAnonKey),
            "Content-Type":"application/json",...extra};
  },
  /* ログイン後の戻り先。Supabaseの許可リストと突き合わせるため、
     末尾の index.html を落としてディレクトリ形に揃える
     （/sheet-prot/index.html のまま送ると許可リストと一致せず弾かれる）。 */
  redirectUrl(){
    return location.origin+location.pathname.replace(/index\.html$/,"");
  },
  /* Googleログインの画面へ送る。ドライブのアプリ専用領域も同時に許可してもらう */
  signInWithGoogle(){
    const params=new URLSearchParams({
      provider:"google",
      redirect_to:this.redirectUrl(),
      scopes:DRIVE_SCOPE,
    });
    location.href=`${APP_CONFIG.supabaseUrl}/auth/v1/authorize?${params}`;
  },
  /* ログイン後に戻ってきたURL（#access_token=... または #error=...）を処理する。
     戻り値： "ok" | "error" | false（何も無かった） */
  captureRedirect(){
    if(!location.hash||location.hash.length<2)return false;
    const p=new URLSearchParams(location.hash.slice(1));

    // 同意しなかった場合などはエラーが返る。黙って握りつぶさず利用者に伝える
    const err=p.get("error")||p.get("error_code");
    if(err){
      this.lastError=p.get("error_description")
        ? decodeURIComponent(p.get("error_description")).replace(/\+/g," ")
        : err;
      history.replaceState(null,"",location.pathname+location.search);
      return "error";
    }

    const access=p.get("access_token");
    if(!access)return false;
    this.saveSession({
      access_token:access,
      refresh_token:p.get("refresh_token")||"",
      expires_at:Date.now()+(Number(p.get("expires_in"))||3600)*1000,
      provider_token:p.get("provider_token")||"",
      // Googleのアクセストークンは約1時間で失効する
      provider_token_expires_at:p.get("provider_token")?Date.now()+3600*1000:0,
      user:null,
    });
    history.replaceState(null,"",location.pathname+location.search);
    return "ok";
  },
  expired(){ return !this.session||Date.now()>(this.session.expires_at||0)-60000 },
  /* 期限が近ければ更新する */
  async ensureFresh(){
    if(!this.session)return false;
    if(!this.expired())return true;
    if(!this.session.refresh_token){ this.saveSession(null); return false }
    try{
      const res=await fetch(`${APP_CONFIG.supabaseUrl}/auth/v1/token?grant_type=refresh_token`,{
        method:"POST",
        headers:{apikey:APP_CONFIG.supabaseAnonKey,"Content-Type":"application/json"},
        body:JSON.stringify({refresh_token:this.session.refresh_token}),
      });
      if(!res.ok)throw new Error("セッションを更新できませんでした");
      const d=await res.json();
      this.saveSession({
        access_token:d.access_token,
        refresh_token:d.refresh_token||this.session.refresh_token,
        expires_at:Date.now()+(Number(d.expires_in)||3600)*1000,
        // Googleの権限はSupabaseのセッションとは別に期限を持つ
        provider_token:this.session.provider_token||"",
        provider_token_expires_at:this.session.provider_token_expires_at||0,
        user:d.user||this.session.user,
      });
      return true;
    }catch(e){ this.saveSession(null); return false }
  },
  async getUser(){
    if(!await this.ensureFresh())return null;
    if(this.session.user)return this.session.user;
    const res=await fetch(`${APP_CONFIG.supabaseUrl}/auth/v1/user`,{headers:this.headers()});
    if(!res.ok)return null;
    const user=await res.json();
    this.saveSession({...this.session,user});
    return user;
  },
  /* 会員種別をサーバーから取得する（これが唯一の正） */
  async fetchProfile(){
    if(!await this.ensureFresh())return null;
    const res=await fetch(
      `${APP_CONFIG.supabaseUrl}/rest/v1/profiles?select=*&id=eq.${this.session.user?.id||""}`,
      {headers:this.headers()});
    if(!res.ok)return null;
    return (await res.json())[0]||null;
  },
  async updateDisplayName(name){
    if(!await this.ensureFresh())return false;
    const res=await fetch(
      `${APP_CONFIG.supabaseUrl}/rest/v1/profiles?id=eq.${this.session.user?.id||""}`,
      {method:"PATCH",headers:this.headers({Prefer:"return=minimal"}),
       body:JSON.stringify({display_name:name})});
    return res.ok;
  },
  /* データベース側の関数を呼ぶ（印刷回数の消費など） */
  async rpc(name,args={}){
    if(!await this.ensureFresh())throw new Error("ログインが必要です");
    const res=await fetch(`${APP_CONFIG.supabaseUrl}/rest/v1/rpc/${name}`,{
      method:"POST",headers:this.headers(),body:JSON.stringify(args)});
    if(!res.ok)throw new Error(`処理できませんでした (${res.status})`);
    return res.json();
  },
  /* Edge Function の呼び出し（決済・解約・問い合わせ） */
  async callFunction(name,body={}){
    if(!await this.ensureFresh())throw new Error("ログインが必要です");
    let res;
    try{
      res=await fetch(`${APP_CONFIG.supabaseUrl}/functions/v1/${name}`,{
        method:"POST",headers:this.headers(),body:JSON.stringify(body)});
    }catch(e){
      // fetch自体が失敗するのは、通信できないか、応答がCORSで破棄された場合。
      // 「Failed to fetch」のままでは原因にたどり着けないため、確認先を添える。
      throw new Error(
        `サーバーに接続できませんでした（${name}）。`+
        "通信の状態と、Edge Functionのデプロイおよび ALLOWED_ORIGINS の設定をご確認ください");
    }
    const data=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(data.error||`処理できませんでした (${res.status})`);
    return data;
  },
  async signOut(){
    try{
      if(this.session?.access_token){
        await fetch(`${APP_CONFIG.supabaseUrl}/auth/v1/logout`,
          {method:"POST",headers:this.headers()});
      }
    }catch(e){}
    this.saveSession(null);
  },
};

/* =====================================================================
   アカウント（画面から見たログイン状態）
   ---------------------------------------------------------------------
   Supabaseのセッションとprofilesを、画面で使いやすい形にまとめたもの。
   plan はサーバーの値をそのまま映すだけで、ここからは書き換えない。
   ===================================================================== */
const ACCOUNT_KEY="seat-chart-account";
const AUTH={
  account:null,
  load(){
    try{ this.account=JSON.parse(localStorage.getItem(ACCOUNT_KEY)||"null") }
    catch(e){ this.account=null }
    return this.account;
  },
  persist(){
    try{
      if(this.account)localStorage.setItem(ACCOUNT_KEY,JSON.stringify(this.account));
      else localStorage.removeItem(ACCOUNT_KEY);
    }catch(e){ /* プライベートモード等で書けない場合はこのセッション限りとなる */ }
  },
  signedIn(){ return !!this.account },
  isPremium(){ return this.account?.plan==="premium" },
  displayName(){ return (this.account?.name||this.account?.email||"ゲスト") },
  /* Supabaseのユーザーとprofilesから、画面用のアカウント情報を作る */
  applyServer(user,profile){
    this.account={
      sub:user.id,
      email:user.email||"",
      name:profile?.display_name||user.user_metadata?.full_name||user.user_metadata?.name||"",
      picture:user.user_metadata?.avatar_url||"",
      plan:profile?.plan==="premium"?"premium":"free",
      periodEnd:profile?.current_period_end||"",
      cancelAtPeriodEnd:!!profile?.cancel_at_period_end,
      printCount:Number(profile?.print_count||0),
      updatedAt:Date.now(),
    };
    this.persist(); return this.account;
  },
  rename(name){
    if(!this.account)return;
    this.account.name=(name||"").trim();
    this.account.updatedAt=Date.now();
    this.persist();
    SB.updateDisplayName(this.account.name).catch(()=>{});
  },
  signOut(){ this.account=null; this.persist(); },
  /* サーバーの会員種別を取り込み直す（決済の直後などに呼ぶ） */
  async refreshPlanFromServer(){
    if(!this.account||!SB_READY())return this.account?.plan||null;
    const user=await SB.getUser(); if(!user)return null;
    const profile=await SB.fetchProfile();
    this.applyServer(user,profile);
    return this.account.plan;
  },
};

function currentOwnerId(){ return AUTH.account?.sub||"" }

/* ---------------- Googleログイン（Google Identity Services） ---------------- */
let _gisPromise=null;
function loadGIS(){
  if(_gisPromise)return _gisPromise;
  _gisPromise=new Promise((resolve,reject)=>{
    if(window.google?.accounts?.id)return resolve();
    const s=document.createElement("script");
    s.src="https://accounts.google.com/gsi/client";
    s.async=true; s.defer=true;
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error("Googleログインを読み込めませんでした"));
    document.head.append(s);
  });
  return _gisPromise;
}
/* =====================================================================
   クラウド同期（Google Drive の appDataFolder）
   ---------------------------------------------------------------------
   「同じGoogleアカウントなら、別の端末でもデータが引き継がれる」ための保存先。

   なぜ Drive の appDataFolder を選んだか：
     - サーバーを用意しなくても、静的サイトのままアカウント単位の保存ができる
     - 生徒名簿という個人情報を、開発者側のデータベースではなく
       利用者本人のGoogleドライブ内に置ける（預かる範囲を最小にできる）
     - appDataFolder は本アプリ専用の隠し領域で、ドライブの画面には現れない

   保存の形（appDataFolder内）:
     tpl_<テンプレートID>.json … テンプレート1件
     _deleted.json             … 削除済みIDと削除時刻（端末間で削除を伝えるため）
   ===================================================================== */
const DRIVE_SCOPE="https://www.googleapis.com/auth/drive.appdata";
const OAUTH_SCOPES=["openid","email","profile",DRIVE_SCOPE].join(" ");
const TOMB_FILE="_deleted.json";

const CLOUD={
  token:null, tokenExpiresAt:0, client:null,
  configured(){ return !!APP_CONFIG.googleClientId },
  hasToken(){ return !!this.token&&Date.now()<this.tokenExpiresAt-60000 },

  /* アクセストークンを取得する。interactive=false なら同意画面を出さずに静かに更新を試みる
     （ページを再読込した直後など、すでに同意済みのケースを想定） */
  async getToken(interactive){
    if(this.hasToken())return this.token;
    // ログイン直後はSupabaseがGoogleのアクセストークンを渡してくれるので、それを使う。
    // ただしGoogleのトークンは約1時間で失効するため、取得時刻から期限を判断する
    // （期限切れのまま使い続けると、以降ずっと同期できなくなる）。
    const pt=SB.session?.provider_token;
    const ptExp=SB.session?.provider_token_expires_at||0;
    if(pt&&Date.now()<ptExp-60000){
      this.token=pt;
      this.tokenExpiresAt=ptExp;
      return this.token;
    }
    if(!this.configured())throw new Error("GoogleクライアントIDが未設定です");
    await loadGIS();
    return new Promise((resolve,reject)=>{
      this.client=google.accounts.oauth2.initTokenClient({
        client_id:APP_CONFIG.googleClientId,
        scope:OAUTH_SCOPES,
        callback:res=>{
          if(res&&res.access_token){
            this.token=res.access_token;
            this.tokenExpiresAt=Date.now()+(Number(res.expires_in)||3600)*1000;
            resolve(this.token);
          }else reject(new Error(res?.error_description||res?.error||"アクセス権を取得できませんでした"));
        },
        error_callback:err=>{
          // 自動同期のような「利用者の操作を伴わない」場面では、
          // ブラウザがポップアップを塞ぐ。手動操作なら通るので、その旨を伝える。
          const e=new Error(
            err?.type==="popup_failed_to_open" ? "ブラウザにポップアップを塞がれました"
            : err?.type==="popup_closed"       ? "Googleの画面が閉じられました"
            : (err?.message||"Googleの利用許可を取得できませんでした"));
          e.needsUserAction=(err?.type==="popup_failed_to_open"||err?.type==="popup_closed");
          reject(e);
        },
      });
      this.client.requestAccessToken(interactive?{}:{prompt:""});
    });
  },
  /* 使えなくなったトークンを捨てる。ログイン時にもらったGoogleトークンも一緒に捨てないと、
     再試行でも同じ失効トークンを使い続けてしまい、取り直しに進めない。 */
  clearToken(){
    this.token=null; this.tokenExpiresAt=0;
    if(SB.session?.provider_token){
      SB.saveSession({...SB.session,provider_token:"",provider_token_expires_at:0});
    }
  },

  /* Drive APIの呼び出し。トークン切れ(401/403)は1度だけ取り直して再試行する */
  async api(url,opts={},retry=true){
    const token=await this.getToken(false);
    if(!token)throw new Error("Googleドライブの利用許可を取得できませんでした");
    const res=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+token}});
    if((res.status===401||res.status===403)&&retry){
      this.clearToken();
      return this.api(url,opts,false);
    }
    if(!res.ok)throw new Error(`Drive APIエラー (${res.status})`);
    return res;
  },
  async listFiles(){
    const url="https://www.googleapis.com/drive/v3/files"
      +"?spaces=appDataFolder&pageSize=1000&fields=files(id,name,modifiedTime)";
    const res=await this.api(url);
    return (await res.json()).files||[];
  },
  async download(fileId){
    const res=await this.api(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    return res.json();
  },
  async upload(name,obj,fileId){
    const body=new FormData();
    body.append("metadata",new Blob([JSON.stringify(
      fileId?{name}:{name,parents:["appDataFolder"]})],{type:"application/json"}));
    body.append("file",new Blob([JSON.stringify(obj)],{type:"application/json"}));
    const url=fileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=multipart`
      : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
    const res=await this.api(url,{method:fileId?"PATCH":"POST",body});
    return res.json();
  },
  async remove(fileId){
    await this.api(`https://www.googleapis.com/drive/v3/files/${fileId}`,{method:"DELETE"});
  },
};

/* テンプレートを削除したことを記録する（他の端末へ「消した」と伝えるため） */
function markDeleted(id){
  const t=loadTombstones(); t[id]=Date.now(); saveTombstones(t);
}

/* ローカルとリモートを突き合わせて、あるべき状態を決める純関数。
   ・削除記録が更新時刻より新しければ削除を優先
   ・そうでなければ updatedAt が新しい側を採用 */
function mergeTemplates(local,remote,tomb){
  const result=new Map(), toUpload=[], toDeleteRemote=[];
  const deletedAfter=(id,t)=>tomb[id]&&tomb[id]>=(t?.updatedAt||0);

  remote.forEach(({tpl,fileId})=>{
    if(!tpl||!tpl.id)return;
    if(deletedAfter(tpl.id,tpl)){ toDeleteRemote.push(fileId); return }
    result.set(tpl.id,{tpl,fileId});
  });
  local.forEach(tpl=>{
    if(deletedAfter(tpl.id,tpl))return;                 // この端末で削除済み
    const hit=result.get(tpl.id);
    if(!hit){ result.set(tpl.id,{tpl,fileId:null}); toUpload.push(tpl.id); return }
    if((tpl.updatedAt||0)>(hit.tpl.updatedAt||0)){       // ローカルの方が新しい
      result.set(tpl.id,{tpl,fileId:hit.fileId});
      toUpload.push(tpl.id);
    }
  });
  return {
    merged:[...result.values()],
    toUpload:[...new Set(toUpload)],
    toDeleteRemote,
  };
}

const SYNC={
  state:"off",          // off | idle | syncing | ok | error | needsAction
  lastAt:0, lastError:"", timer:null,
  /* 端末間の引き継ぎはプレミアム会員の機能 */
  available(){
    return CLOUD.configured()&&AUTH.signedIn()&&AUTH.isPremium();
  },
  label(){
    // β版のあいだは会員種別を出さない（全員が無料会員のため）
    if(BETA_FREE()&&!this.available())return "この端末のみに保存";
    if(AUTH.signedIn()&&!AUTH.isPremium())return "この端末のみに保存（無料会員）";
    if(!this.available())return "この端末のみに保存";
    if(this.state==="syncing")return "同期中…";
    // 自動同期中はブラウザがGoogleの確認画面を開けないことがある。
    // その場合は「今すぐ同期」を押してもらえば通る。
    if(this.state==="needsAction")return "「今すぐ同期」を押してください";
    if(this.state==="error")return "同期できませんでした";
    if(this.state==="ok"&&this.lastAt)return "同期済み "+jpDT(this.lastAt);
    return "未同期";
  },
  /* 保存のたびに呼ばれる。まとめて送るため少し待ってから実行する */
  schedule(){
    if(!this.available())return;
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>this.run({quiet:true}),2500);
  },
  /* quiet:true … 自動実行（画面を邪魔しない）
     interactive:true … 利用者がボタンを押した場合。必要ならGoogleの確認画面を開いてよい */
  async run({quiet,interactive}={}){
    if(!this.available()){ this.state="off"; return false }
    if(this.state==="syncing")return false;
    this.state="syncing"; if(!quiet)refreshSyncUI();
    try{
      // 押された直後なら、失効していても確認画面を開いて取り直せる
      if(interactive&&!CLOUD.hasToken())await CLOUD.getToken(true);
      const owner=currentOwnerId();
      const files=await CLOUD.listFiles();
      const tombFile=files.find(f=>f.name===TOMB_FILE)||null;

      // 削除記録をローカルとリモートで統合する
      let tomb=loadTombstones();
      if(tombFile){
        const remoteTomb=await CLOUD.download(tombFile.id).catch(()=>({}));
        Object.entries(remoteTomb||{}).forEach(([id,at])=>{
          if(!tomb[id]||at>tomb[id])tomb[id]=at;
        });
      }

      // リモートのテンプレートを読み込む
      const remote=[];
      for(const f of files.filter(f=>/^tpl_.*\.json$/.test(f.name))){
        const tpl=await CLOUD.download(f.id).catch(()=>null);
        if(tpl)remote.push({tpl,fileId:f.id});
      }

      const {merged,toUpload,toDeleteRemote}=mergeTemplates(store.all(),remote,tomb);

      // 反映：リモートへ書き込み／削除
      for(const fileId of toDeleteRemote)await CLOUD.remove(fileId).catch(()=>{});
      const byId=new Map(merged.map(m=>[m.tpl.id,m]));
      for(const id of toUpload){
        const m=byId.get(id); if(!m)continue;
        const saved=await CLOUD.upload(`tpl_${id}.json`,m.tpl,m.fileId);
        if(saved?.id)m.fileId=saved.id;
      }
      await CLOUD.upload(TOMB_FILE,tomb,tombFile?.id);
      saveTombstones(tomb);

      // 反映：この端末へ（自分のデータとして取り込む）
      // 取り込んだものは必ず今のアカウントの持ち物にする。
      // 別のIDのまま保存すると、次回の読み込みで自分のデータとして拾えず消えたように見える。
      const list=merged.map(m=>m.tpl).filter(t=>t&&t.id);
      list.forEach(t=>{ t.ownerId=owner });
      Object.keys(tomb).forEach(id=>{ idbDelete(id).catch(()=>{}) });
      await Promise.all(list.map(t=>idbPut(t)));

      // 取り込みでテンプレートの実体が差し替わることがある。開いている画面は
      // 古いオブジェクトを掴んだままなので、入れ替わったら画面を作り直す。
      // （そのまま編集を続けると、古い内容を上書き保存してしまう）
      const openBefore=R.tplId?store.get(R.tplId):null;
      store.data.templates=list.sort((a,b)=>b.createdAt-a.createdAt);
      const openAfter=R.tplId?store.get(R.tplId):null;
      if(openBefore!==openAfter)render();

      this.state="ok"; this.lastAt=Date.now(); this.lastError="";
      return true;
    }catch(err){
      // ポップアップを塞がれた場合は失敗ではなく「操作待ち」として扱う
      this.state=err&&err.needsUserAction?"needsAction":"error";
      this.lastError=String(err&&err.message||err);
      return false;
    }finally{
      refreshSyncUI();
    }
  },
};
/* 同期状態の表示だけを更新する（画面全体を作り直さない） */

  document.querySelectorAll("[data-sync-label]").forEach(n=>{n.textContent=SYNC.label()});
}

  const counter=el("div",{style:{fontSize:"11.5px",color:"var(--ink3)",textAlign:"right",marginTop:"4px"},text:"0 / 4000"});
  msgIn.addEventListener("input",()=>{counter.textContent=`${msgIn.value.length} / 4000`});

  // 失敗の理由はダイアログ内に残す。トーストだと数秒で消えるうえ、
  // 入力し直しになると書いた内容を失ってしまうため。
  const errBox=el("div",{class:"alert",style:{display:"none",marginTop:"12px"}});
  const showError=msg=>{
    errBox.innerHTML="";
    errBox.append(el("h4",{text:"送信できませんでした"}),el("div",{text:msg}));
    errBox.style.display="";
  };

  const send=el("button",{class:"btn btn-primary",onclick:async()=>{
    const message=msgIn.value.trim();
    if(!message){ msgIn.focus(); return toast("内容を入力してください") }
    if(message.length>4000)return toast("内容は4000文字以内で入力してください");
    errBox.style.display="none";
    send.disabled=true; send.textContent="送信中…";
    try{
      await SB.callFunction("send-inquiry",{
        category:cat.value, name:nameIn.value.trim(),
        email:mailIn.value.trim(), message,
      });
      closeModal();
      toast("送信しました。ありがとうございます");
    }catch(err){
      send.disabled=false; send.textContent="送信する";
      showError(String(err&&err.message||err));
    }
  }},"送信する");

  modal({title:"問い合わせ",
    desc:"ご質問・不具合のご報告・機能のご要望をお寄せください。",
    body:el("div",{},
      el("label",{class:"field"},el("span",{text:"種別"}),cat),
      el("label",{class:"field"},el("span",{text:"お名前"}),nameIn),
      el("label",{class:"field"},el("span",{text:"メールアドレス（返信先）"}),mailIn),
      el("label",{class:"field",style:{marginBottom:"4px"}},el("span",{text:"内容"}),msgIn),
      counter,
      el("p",{style:{marginTop:"10px",fontSize:"12px",color:"var(--ink3)",lineHeight:"1.7"},
        text:"ご利用のブラウザ情報が一緒に送信されます。生徒の名簿の内容が送信されることはありません。"}),
      errBox),
    footer:[el("button",{class:"btn",onclick:closeModal},"閉じる"),send]});
}

/* ---------------- 出席番号の重複 ----------------
   出席番号は座席への配置（c.assign）から生徒を引くための鍵になっている。
   重複すると roster.find(x=>x.no===no) が常に先頭の1件しか返さないため、
   もう一方の生徒は座席に名前が出ず、ランダム配置でも席に着けない。
   画面から番号を直す手段がないので、重複そのものを作らせない。 */
function duplicateNos(roster){
  const count=new Map();
  (roster||[]).forEach(s=>count.set(s.no,(count.get(s.no)||0)+1));
  return [...count.entries()].filter(([,n])=>n>1).map(([no])=>no);
}
/* 名簿の並び順のまま 1,2,3… へ振り直す */
function renumberRoster(roster){
  return (roster||[]).map((s,i)=>({...s,no:i+1}));
}
/* 次に使う出席番号。件数ではなく最大値+1にしないと、
   途中の生徒を削除してから追加したときに既存の番号とぶつかる。 */
function nextRosterNo(roster){
  return (roster||[]).reduce((m,s)=>Math.max(m,Number(s.no)||0),0)+1;
}

/* ---------------- CSV パーサ（引用符・カンマ・改行入りセル対応） ---------------- */
function parseCSV(text){
  const rows=[];let row=[],field="",inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++} else inQ=false; }
      else field+=ch;
    }else{
      if(ch==='"')inQ=true;
      else if(ch===",")  {row.push(field);field="";}
      else if(ch==="\r") {/* 改行はLFで確定するため無視 */}
      else if(ch==="\n") {row.push(field);rows.push(row);row=[];field="";}
      else field+=ch;
    }
  }
  if(field!==""||row.length){row.push(field);rows.push(row);}
  return rows;
}

/* ---------------- .xlsx パーサ（外部ライブラリ不使用・ブラウザ内蔵APIのみでZIP展開） ---------------- */
async function inflateRaw(bytes){
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
function readZipEntries(buf){
  const dv=new DataView(buf);
  const sig=0x06054b50;
  let eocd=-1;
  const start=Math.max(0,buf.byteLength-22-65557);
  for(let i=buf.byteLength-22;i>=start;i--){ if(dv.getUint32(i,true)===sig){eocd=i;break} }
  if(eocd<0)throw new Error("xlsx（ZIP形式）として認識できませんでした");
  const cdCount=dv.getUint16(eocd+10,true);
  let off=dv.getUint32(eocd+16,true);
  const entries={};
  for(let n=0;n<cdCount;n++){
    if(dv.getUint32(off,true)!==0x02014b50)break;
    const method=dv.getUint16(off+10,true);
    const compSize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true);
    const extraLen=dv.getUint16(off+30,true);
    const commentLen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=new TextDecoder().decode(new Uint8Array(buf,off+46,nameLen));
    entries[name]={method,compSize,lho};
    off+=46+nameLen+extraLen+commentLen;
  }
  return entries;
}
async function readZipEntry(buf,entries,name){
  const e=entries[name]; if(!e)return null;
  const dv=new DataView(buf);
  if(dv.getUint32(e.lho,true)!==0x04034b50)throw new Error("ZIPローカルヘッダが不正です");
  const nameLen=dv.getUint16(e.lho+26,true);
  const extraLen=dv.getUint16(e.lho+28,true);
  const dataOff=e.lho+30+nameLen+extraLen;
  const raw=new Uint8Array(buf,dataOff,e.compSize);
  if(e.method===0)return raw.slice();
  if(e.method===8)return inflateRaw(raw);
  throw new Error("未対応の圧縮方式（method="+e.method+"）です");
}
async function parseXLSXRows(file){
  const buf=await file.arrayBuffer();
  const entries=readZipEntries(buf);
  const dec=new TextDecoder("utf-8");
  const xml=async name=>{
    const bytes=await readZipEntry(buf,entries,name);
    return bytes?new DOMParser().parseFromString(dec.decode(bytes),"application/xml"):null;
  };
  const wb=await xml("xl/workbook.xml");
  if(!wb)throw new Error("workbook.xml が見つかりません");
  const firstSheet=wb.querySelector("sheets sheet");
  if(!firstSheet)throw new Error("シートが見つかりません");
  const rId=firstSheet.getAttribute("r:id")
    ||firstSheet.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
  const rels=await xml("xl/_rels/workbook.xml.rels");
  let target="worksheets/sheet1.xml";
  if(rels){
    const rel=[...rels.getElementsByTagName("Relationship")].find(r=>r.getAttribute("Id")===rId);
    if(rel)target=rel.getAttribute("Target").replace(/^\/?xl\//,"").replace(/^\.?\//,"");
  }
  const sheetDoc=await xml("xl/"+target);
  if(!sheetDoc)throw new Error("先頭のシートを読み込めませんでした");
  let shared=[];
  const ssDoc=await xml("xl/sharedStrings.xml");
  if(ssDoc)shared=[...ssDoc.getElementsByTagName("si")]
    .map(si=>[...si.getElementsByTagName("t")].map(t=>t.textContent).join(""));
  const colToIdx=col=>{let n=0;for(const ch of col)n=n*26+(ch.charCodeAt(0)-64);return n-1};
  return [...sheetDoc.getElementsByTagName("row")].map(rEl=>{
    const row=[];
    [...rEl.getElementsByTagName("c")].forEach(c=>{
      const ref=c.getAttribute("r")||"";
      const i=colToIdx((ref.match(/^[A-Z]+/)||["A"])[0]);
      const type=c.getAttribute("t");
      let val="";
      if(type==="inlineStr"){
        const is=c.getElementsByTagName("is")[0];
        val=is?[...is.getElementsByTagName("t")].map(t=>t.textContent).join(""):"";
      }else{
        const v=c.getElementsByTagName("v")[0];
        const raw=v?v.textContent:"";
        val=type==="s"?(shared[+raw]||""):raw;
      }
      row[i]=val;
    });
    for(let i=0;i<row.length;i++)if(row[i]===undefined)row[i]="";
    return row;
  });
}

/* ---------------- 取り込み共通処理 ---------------- */
function applyRosterRows(rows,t,draw){
  rows=rows.filter(r=>r.some(c=>String(c??"").trim()!==""));
  if(!rows.length)return dlgError("名簿を読み込めませんでした",["データが空です"]);
  const head=rows[0].map(s=>String(s??"").trim());
  const idx=k=>head.findIndex(h=>h.includes(k));
  const iNo=idx("番号"),iNm=idx("氏名"),iKn=idx("ふりがな"),iGd=idx("性別"),iRj=idx("ローマ字");
  if([iNo,iNm,iKn,iGd].some(i=>i<0))
    return dlgError("名簿を読み込めませんでした",["必須列が見つかりません：番号・氏名・ふりがな・性別","1行目を見出し行にしてください"]);
  let out=[];
  rows.slice(1).forEach(r=>{
    const name=String(r[iNm]??"").trim(); if(!name)return;
    const kana=String(r[iKn]??"").trim();
    const manualRj=iRj>=0?String(r[iRj]??"").trim():"";
    out.push({no:+r[iNo]||out.length+1,name,kana,romaji:manualRj||toRomaji(kana),
      gender:/女|f/i.test(String(r[iGd]??""))?"f":"m"});
  });
  if(!out.length)return dlgError("名簿を読み込めませんでした",["データ行がありません"]);

  // 出席番号が重複したままだと、片方の生徒が座席に表示されず配置もできない。
  // 黙って取り込まず、振り直すかどうかを確認する。
  const dups=duplicateNos(out);
  if(dups.length){
    modal({title:"出席番号が重複しています",
      desc:`重複している番号：${dups.join("、")}`,
      body:el("div",{},
        el("div",{class:"alert"},
          el("h4",{text:"このままでは正しく使えません"}),
          el("div",{text:"出席番号が同じ生徒がいると、片方の生徒は座席に名前が表示されず、ランダム配置でも席に着けません。"})),
        el("p",{style:{marginTop:"12px",fontSize:"13px",color:"var(--ink2)",lineHeight:"1.7"},
          text:"名簿の並び順のまま 1 から振り直して読み込むか、元のファイルの番号を直してから読み込み直してください。"})),
      footer:[el("button",{class:"btn",onclick:closeModal},"やめる"),
        el("button",{class:"btn btn-primary",onclick:()=>{
          closeModal(); out=renumberRoster(out); askSwap();
        }},"番号を振り直して読み込む")]});
    return;
  }
  askSwap();

  function askSwap(){
  // 名簿を入れ替えると、既存の座席表の配置や固定席・NGペアが「存在しない生徒番号」を
  // 指したままになる。黙って壊さず、影響を数えて確認をとってから掃除する。
  const impact=rosterSwapImpact(t,out);
  if(impact.total===0){ commit(); return }
  modal({title:"名簿を入れ替えますか？",
    desc:`${t.roster.length}名 → ${out.length}名 に置き換えます。`,
    body:el("div",{},
      el("div",{class:"alert"},
        el("h4",{text:"影響する設定があります"}),
        el("ul",{style:{margin:"6px 0 0 17px",lineHeight:"1.7"}},
          impact.seats?el("li",{text:`既存の座席表の配置 ${impact.seats}席分が空席に戻ります`}):null,
          impact.fixed?el("li",{text:`固定席 ${impact.fixed}件が解除されます`}):null,
          impact.ng?el("li",{text:`NGペア ${impact.ng}件が解除されます`}):null)),
      el("p",{style:{marginTop:"12px",fontSize:"13px",color:"var(--ink2)"},
        text:"新しい名簿にも同じ出席番号の生徒がいる場合、その席はそのまま残ります。"})),
    footer:[el("button",{class:"btn",onclick:closeModal},"やめる"),
      el("button",{class:"btn btn-primary",onclick:()=>{closeModal();commit()}},"入れ替える")]});
  }

  function commit(){
    // ふりがな欄に漢字や英字が入っていると、ローマ字が空のまま取り込まれ、
    // 座席表に氏名だけが並ぶ。列の対応がずれている可能性が高いので知らせる。
    const noRomaji=out.filter(s=>s.kana&&!s.romaji).length;
    if(noRomaji>0&&noRomaji>=out.length/2){
      dlgError("ふりがなの列をご確認ください",[
        `${out.length}名中${noRomaji}名で、ふりがなからローマ字を作れませんでした`,
        "「ふりがな」の列に、ひらがな・カタカナ以外（漢字や英字）が入っていませんか",
        "列の対応が正しい場合は、このまま名簿のローマ字欄を直接編集できます"]);
    }
    t.roster=out;
    purgeMissingStudents(t);
    store.save(t);draw();toast(`${out.length}名を読み込みました`);
  }
}

/* 名簿を newRoster に入れ替えたときに失われる設定の件数を数える。
   固定席・NGペアは画面に見えているテンプレート側の件数で伝える
   （座席表ごとのスナップショットまで足すと、利用者の見た目より多い数字になってしまう）。 */
function rosterSwapImpact(t,newRoster){
  const has=no=>newRoster.some(r=>r.no===no);
  const seats=(t.charts||[]).reduce((n,c)=>
    n+Object.values(c.assign||{}).filter(no=>!has(no)).length,0);
  const fixed=(t.fixedSeats||[]).filter(f=>!has(f.no)).length;
  const ng=(t.ngPairs||[]).filter(p=>p.some(no=>!has(no))).length;
  return {seats,fixed,ng,total:seats+fixed+ng};
}

/* 名簿に存在しない生徒番号への参照を、テンプレート・全座席表から取り除く。
   放置すると「配置35席」と表示されるのに実際は誰も表示されない状態になる。 */
function purgeMissingStudents(t){
  const has=no=>t.roster.some(r=>r.no===no);
  const cleanSeats=arr=>(arr||[]).filter(f=>has(f.no));
  const cleanPairs=arr=>(arr||[]).filter(p=>p.every(no=>has(no)));
  t.fixedSeats=cleanSeats(t.fixedSeats);
  t.ngPairs=cleanPairs(t.ngPairs);
  (t.charts||[]).forEach(c=>{
    Object.entries(c.assign||{}).forEach(([sid,no])=>{ if(!has(no))delete c.assign[sid] });
    c.fixedSeats=cleanSeats(c.fixedSeats);
    c.ngPairs=cleanPairs(c.ngPairs);
  });
}
async function importRoster(file,t,draw){
  if(!file)return;
  try{
    let rows;
    if(/\.xlsx$/i.test(file.name)){
      if(typeof DecompressionStream==="undefined")
        return dlgError("この .xlsx を読み込めませんでした",
          ["このブラウザは.xlsx読み込みに必要な機能(DecompressionStream)に対応していません","CSV形式で書き出して読み込んでください"]);
      rows=await parseXLSXRows(file);
    }else{
      rows=parseCSV(String(await file.text()).replace(/^﻿/,""));
    }
    applyRosterRows(rows,t,draw);
  }catch(err){
    dlgError("名簿を読み込めませんでした",[String(err&&err.message||err),"ファイル形式を確認するか、CSVで書き出し直してください"]);
  }
}

function dlgAddStudent(t,draw){
  const nm=el("input",{class:"input",placeholder:"例：山田 太郎"});
  const kn=el("input",{class:"input",placeholder:"例：やまだたろう"});
  const rj=el("input",{class:"input",style:{fontFamily:"var(--mono)"}});
  let rjTouched=false;
  rj.addEventListener("input",()=>{rjTouched=true});
  kn.addEventListener("input",()=>{if(!rjTouched)rj.value=toRomaji(kn.value)});
  const gd=el("select",{class:"input"},el("option",{value:"m"},"男"),el("option",{value:"f"},"女"));
  modal({title:"生徒を追加",body:el("div",{},
      el("label",{class:"field"},el("span",{text:"氏名"}),nm),
      el("label",{class:"field"},el("span",{text:"ふりがな"}),kn),
      el("label",{class:"field"},el("span",{text:"ローマ字（ふりがなから自動生成・手修正可）"}),rj),
      el("label",{class:"field"},el("span",{text:"性別"}),gd)),
    footer:[el("button",{class:"btn",onclick:closeModal},"キャンセル"),
      el("button",{class:"btn btn-primary",onclick:()=>{
        if(!nm.value.trim())return nm.focus();
        t.roster.push({no:nextRosterNo(t.roster),name:nm.value.trim(),kana:kn.value.trim(),
          romaji:rj.value.trim()||toRomaji(kn.value),gender:gd.value});
        store.save(t);draw();closeModal();toast("追加しました");
      }},"追加する")]});
}
function dlgError(title,causes){
  modal({title,body:el("div",{class:"alert"},
      el("h4",{text:"処理を中止しました"}),
      el("div",{text:"考えられる原因："}),
      el("ul",{},...causes.map(c=>el("li",{text:c})))),
    footer:[el("button",{class:"btn btn-primary",onclick:closeModal},"閉じる")]});
}

/* --- 座席レイアウト編集 --- */
/* 列数・行数の上限。これを超えると座席が小さくなりすぎて印刷しても読めない。
   「再生成」の入力欄と「＋前」「＋後」の両方で同じ上限を使う。 */
const GRID_MAX=12;

function paneLayout(t){
  const L=t.layout;
  const rerender=()=>{store.save(t);go({})};

  function regrid(cols,rows){
    const keep=new Map(L.seats.map(s=>[`${s.row}:${s.col}`,s]));
    const out=[];
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const old=keep.get(`${r}:${c}`);
      out.push(old?{...old,row:r,col:c}:{id:uid("s"),row:r,col:c,enabled:true,tags:[]});
    }
    L.cols=cols;L.rows=rows;L.seats=out;rerender();
  }
  /* 行を増やしてよいか。上限に達していたら知らせて増やさない
     （「再生成」は12までなのに、こちらは何行でも増やせてしまう状態だった） */
  function canAddRow(){
    if(L.rows<GRID_MAX)return true;
    toast(`行数は${GRID_MAX}行までです。これ以上増やすと座席が小さくなりすぎます`);
    return false;
  }
  function addRowTop(){
    L.seats.forEach(s=>s.row++);
    for(let c=0;c<L.cols;c++)L.seats.push({id:uid("s"),row:0,col:c,enabled:false,tags:[]});
    L.rows++;
  }
  function addRowBottom(){
    for(let c=0;c<L.cols;c++)L.seats.push({id:uid("s"),row:L.rows,col:c,enabled:false,tags:[]});
    L.rows++;
  }
  const at=(r,c)=>L.seats.find(s=>s.row===r&&s.col===c);
  function addFront(c){
    for(let r=0;r<L.rows;r++){const s=at(r,c);if(s&&!s.enabled){s.enabled=true;return rerender()}}
    if(!canAddRow())return;
    addRowTop();at(0,c).enabled=true;rerender();
  }
  function addBack(c){
    for(let r=L.rows-1;r>=0;r--){const s=at(r,c);if(s&&!s.enabled){s.enabled=true;return rerender()}}
    if(!canAddRow())return;
    addRowBottom();at(L.rows-1,c).enabled=true;rerender();
  }

  const enabled=L.seats.filter(s=>s.enabled).length;
  const diff=enabled-t.roster.length;

  // グリッド本体（列ごとの追加ボタン付き）
  const g=el("div",{style:{display:"grid",gap:"6px",
    gridTemplateColumns:`26px repeat(${L.cols},minmax(38px,1fr))`}});
  g.append(el("div"));
  for(let c=0;c<L.cols;c++) g.append(el("button",{class:"btn btn-sm",title:`${c+1}列目の最前列に1席追加`,
    style:{minHeight:"26px",padding:"0",fontSize:"11px"},onclick:()=>addFront(c)},"＋前"));
  for(let r=0;r<L.rows;r++){
    g.append(el("div",{class:"num",style:{fontSize:"10.5px",color:"var(--ink3)",display:"grid",placeItems:"center"},text:r+1}));
    for(let c=0;c<L.cols;c++){
      const s=at(r,c);
      g.append(el("button",{class:"lay-seat"+(s.enabled?"":" off"),
        title:s.enabled?"クリックで削除（位置は維持）":"クリックで復元",
        onclick:()=>{s.enabled=!s.enabled;rerender()}},`${r+1}-${c+1}`));
    }
  }
  g.append(el("div"));
  for(let c=0;c<L.cols;c++) g.append(el("button",{class:"btn btn-sm",title:`${c+1}列目の最後尾に1席追加`,
    style:{minHeight:"26px",padding:"0",fontSize:"11px"},onclick:()=>addBack(c)},"＋後"));

  const colsIn=el("input",{class:"input",type:"number",min:"1",max:String(GRID_MAX),value:L.cols});
  const rowsIn=el("input",{class:"input",type:"number",min:"1",max:String(GRID_MAX),value:L.rows});

  return el("div",{class:"panel"},
    el("div",{class:"box"},
      el("h3",{text:"① 基本レイアウト"}),
      el("p",{class:"hint",text:`列数・行数を決めると座席グリッドを自動生成します（各${GRID_MAX}まで）。`}),
      el("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:"12px",alignItems:"end"}},
        el("label",{class:"field",style:{marginBottom:"0"}},el("span",{text:"列数（横）"}),colsIn),
        el("label",{class:"field",style:{marginBottom:"0"}},el("span",{text:"行数（縦）"}),rowsIn),
        el("button",{class:"btn",onclick:()=>regrid(
          Math.min(GRID_MAX,Math.max(1,+colsIn.value||L.cols)),
          Math.min(GRID_MAX,Math.max(1,+rowsIn.value||L.rows)))},"再生成")),
      el("div",{class:"note",style:{marginTop:"14px"},
        text:"再生成しても、すでに削除した席の状態はできる限り引き継ぎます。"}),
      el("h3",{style:{marginTop:"22px"},text:"③ 保存と反映"}),
      el("p",{class:"hint",text:"変更はテンプレートへ即時保存され、これから作成する座席表に反映されます。過去の座席表履歴は変更されません。"}),
      el("div",{style:{display:"flex",gap:"9px",flexWrap:"wrap"}},
        el("button",{class:"btn",onclick:()=>{L.seats.forEach(s=>s.enabled=true);rerender();toast("すべての座席を復元しました")}},"削除した席をすべて復元"),
        el("button",{class:"btn btn-primary",onclick:()=>{store.save(t);toast("座席レイアウトを保存しました")}},"保存する"))),
    el("div",{class:"box"},
      el("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"baseline",gap:"10px",flexWrap:"wrap"}},
        el("h3",{text:"② 1席単位の編集"}),
        el("span",{class:"chip "+(diff===0?"chip-m":diff>0?"chip-i":"chip-v"),
          text:diff===0?`${enabled}席 ＝ 名簿${t.roster.length}名`
             :diff>0?`${enabled}席（空席 ${diff}）`:`${enabled}席（${-diff}席不足）`})),
      el("p",{class:"hint",text:"席をクリックすると削除／復元します。削除した席はグレーで残り、ほかの席は詰めません。印刷時には表示されません。"}),
      g));
}

/* --- 固定席・NGペア --- */
function paneRules(t){
  const seatLabel=id=>{const s=t.layout.seats.find(x=>x.id===id);
    return s?`前から${s.row+1}列目・${s.col+1}番`:"—"};
  const nameOf=no=>t.roster.find(s=>s.no===no)?.name??`#${no}`;

  const fixList=el("div",{class:"hist"});
  const drawFix=()=>{
    fixList.innerHTML="";
    if(!t.fixedSeats.length)fixList.append(el("p",{style:{color:"var(--ink3)",fontSize:"13px"},text:"固定席はまだありません。"}));
    t.fixedSeats.forEach(f=>fixList.append(el("div",{class:"hrow"},
      el("span",{class:"chip chip-v",text:"固定"}),
      el("b",{text:nameOf(f.no)}),
      el("span",{style:{color:"var(--ink2)",fontSize:"13px"},text:"→ "+seatLabel(f.seatId)}),
      el("span",{class:"spacer",style:{flex:"1"}}),
      el("button",{class:"btn btn-sm btn-danger",onclick:()=>{

const E={mode:"place",sel:null,q:"",unplacedOnly:false,undo:[],redo:[]};
const MAXHIST=60;

function ctx(){
  const t=store.get(R.tplId); if(!t)return null;
  const c=t.charts.find(x=>x.id===R.chartId); if(!c)return null;
  return {t,c};
}
/* 固定席は座席表(c.fixedSeats)とテンプレート(t.fixedSeats)の両方に書き込むため、
   undo/redoでも必ず両方を巻き戻す。片方だけ戻すと座席ピッカーとの表示が食い違う。 */
function snapNow(){
  const k=ctx(); if(!k)return null;
  return{assign:clone(k.c.assign),room:clone(k.c.room),
         fixed:clone(k.c.fixedSeats),tplFixed:clone(k.t.fixedSeats)};
}
function pushUndo(label){
  const s=snapNow(); if(!s)return;
  E.undo.push({...s,label});
  if(E.undo.length>MAXHIST)E.undo.shift();
  E.redo.length=0;
}
function applySnap(s){
  const k=ctx(); if(!k||!s)return;
  k.c.assign=clone(s.assign);k.c.room=clone(s.room);k.c.fixedSeats=clone(s.fixed);
  if(s.tplFixed)k.t.fixedSeats=clone(s.tplFixed);
}
function doUndo(){
  if(!E.undo.length)return toast("これ以上戻せません");
  const cur=snapNow(); if(!cur)return renderEditorBody();
  const s=E.undo.pop();E.redo.push(cur);applySnap(s);
  store.save(ctx().t);renderEditorBody();toast("元に戻しました"+(s.label?`：${s.label}`:""));
}
function doRedo(){
  if(!E.redo.length)return toast("やり直す操作がありません");
  const cur=snapNow(); if(!cur)return renderEditorBody();
  const s=E.redo.pop();E.undo.push(cur);applySnap(s);
  store.save(ctx().t);renderEditorBody();toast("やり直しました");
}

    }},"教室レイアウト"),

/* ---- 用紙・座席の自動フィット ---- */
let FIT={print:false};
function fitSheet(){
  const pad=$(".canvas-pad"),sheet=$(".sheet"); if(!pad||!sheet)return;
  const k=ctx(); if(!k)return; const{t,c}=k;
  const ar=paperAR(t.print.paper,t.print.orient);
  let sw,sh;
  if(FIT.print){
    const mm=96/25.4,d=PAPER[t.print.paper],MG=16; // @page margin 8mm × 2
    sw=((t.print.orient==="landscape"?d.h:d.w)-MG)*mm;
    sh=((t.print.orient==="landscape"?d.w:d.h)-MG)*mm;
  }else{
    const cs=getComputedStyle(pad);
    const availW=pad.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    const availH=pad.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    sh=Math.min(availH,availW/ar); sw=sh*ar;
  }
  sheet.style.width=sw+"px"; sheet.style.height=sh+"px";
  const padPx=sw*0.032;
  sheet.style.setProperty("--pad",padPx+"px");
  sheet.style.setProperty("--fs-hd",Math.max(7,sw*0.0195)+"px");
  const head=sheet.querySelector(".sheet-head");
  const roomW=sw-padPx*2, roomH=sh-padPx*2-(head?head.offsetHeight+padPx:0);
  const L=c.layout, ASPECT=1.34, GAPR=0.10;
  const cw1=roomW/(L.cols+GAPR*(L.cols-1));
  const gridH=roomH*0.80;
  const ch1=gridH/(L.rows+GAPR*(L.rows-1));
  const cw=Math.min(cw1,ch1*ASPECT), ch=cw/ASPECT, gap=cw*GAPR;
  sheet.style.setProperty("--cw",cw+"px");
  sheet.style.setProperty("--ch",ch+"px");
  sheet.style.setProperty("--gap",gap+"px");
  // 実際の氏名フォントサイズは fitSeatNames() が座席ごとに計算し直す
  // （漢字4文字を基準に、席の実スペースから逆算する）。ここでは
  // JS計算前の初期表示がおかしくならないよう、簡易な初期値だけ設定しておく。
  sheet.style.setProperty("--fs-name",Math.max(5,Math.min(cw*0.235,26))+"px");
  sheet.style.setProperty("--fs-sub",Math.max(4,Math.min(cw*0.115,12))+"px");
  sheet.style.setProperty("--fs-room",Math.max(5,Math.min(cw*0.17,15))+"px");
  const grid=sheet.querySelector(".seatgrid");
  if(grid){
    // 教員側（教卓から見た図）では黒板・教卓が下側に反転移動するため、座席グリッドは上側の80%に配置して重ならないようにする。
    // .seatgridはinset:0（top/right/bottom/left=0）が既定なので、top・bottomの両方を明示して高さ80%の領域に固定する。
    const teacher=t.print.facing==="teacher";
    grid.style.top=(teacher?0:roomH*0.20)+"px";
    grid.style.bottom=(teacher?roomH*0.20:0)+"px";
  }
  fitSeatNames();
  avoidRoomOverlaps();
}

/* 氏名・ローマ字が座席内に収まるよう自動縮小する（画面編集・印刷とも共通）。
   氏名は「漢字4文字」を基準の大きさとする——列数などから決め打ちの倍率で
   決めるのではなく、その席の実際の横幅から「4文字ならこの大きさ」を逆算する。
   4文字以下の氏名はすべて同じ基準サイズ（4文字より大きくはしない）、
   4文字より長い氏名は実際の文字数に合わせてさらに縮小し、折り返さず1行に収める。 */
function fitSeatNames(){
  document.querySelectorAll(".seat:not(.off)").forEach(seat=>{
    const nameEl=seat.querySelector(".sname"), subEl=seat.querySelector(".sromaji");
    const shrinkByWidth=n=>{
      n.style.fontSize="";
      const avail=seat.clientWidth-2, w=n.scrollWidth;
      if(w>avail&&w>0){
        const base=parseFloat(getComputedStyle(n).fontSize);
        n.style.fontSize=(base*Math.max(0.45,avail/w))+"px";
      }
    };
    if(subEl)shrinkByWidth(subEl);
    if(!nameEl)return;
    const text=nameEl.textContent||"";
    if(!text.length)return;
    // 大きめの基準フォントで実際の1文字あたりの幅を測り、そこから
    // 「席の余白を除いた幅に4文字がぴったり収まる大きさ」を逆算する
    // （文字幅はフォントサイズに比例するため、1回の計測で正確に求まる）。
    const REF=120, avail=Math.max(1,seat.clientWidth-2);
    nameEl.style.fontSize=REF+"px";
    const perChar=nameEl.scrollWidth/text.length;
    const base4=REF*avail/(perChar*4);
    const font=text.length<=4?base4:base4*(4/text.length);
    nameEl.style.fontSize=Math.max(4,font)+"px";
    // 番号バッジ（左上・絶対配置）と実際に重なっていないかをDOM上で直接確認し、
    // 重なっていればそれが解消するまで追加で縮める（席が小さく氏名が大きい場合の保険）。
    const noEl=seat.querySelector(".sno");
    if(noEl){
      for(let i=0;i<4;i++){
        const nr=nameEl.getBoundingClientRect(), nb=noEl.getBoundingClientRect();
        const overlap=Math.max(0,Math.min(nr.right,nb.right)-Math.max(nr.left,nb.left))
                     *Math.max(0,Math.min(nr.bottom,nb.bottom)-Math.max(nr.top,nb.top));
        if(overlap<=0)break;
        const cur=parseFloat(getComputedStyle(nameEl).fontSize);
        nameEl.style.fontSize=(cur*0.85)+"px";
      }
    }
  });
}
window.addEventListener("resize",()=>{if(R.view==="edit")fitSheet()});

  (c.room||[]).forEach(ri=>room.append(roomItemEl(ri,c,teacher)));

  const grid=el("div",{class:"seatgrid",style:{gridTemplateColumns:`repeat(${c.layout.cols},var(--cw))`}});
  const byRC=[...c.layout.seats].sort((a,b)=>a.row-b.row||a.col-b.col);
  byRC.forEach(s=>grid.append(seatEl(s,t,c,teacher)));
  room.append(grid);

  const sheet=el("div",{class:"sheet",style:{aspectRatio:String(paperAR(t.print.paper,t.print.orient))}},head,room);
  return el("div",{class:"canvas-pad"},sheet);
}

/* 実際に並んでいる座席の外接矩形を、部屋に対する%で返す */
function seatBoundsPct(room){
  const seats=[...room.querySelectorAll(".seat:not(.off)")];
  const rb=room.getBoundingClientRect();
  if(!seats.length||!rb.width||!rb.height)return null;
  let l=Infinity,t=Infinity,r=-Infinity,b=-Infinity;
  seats.forEach(s=>{const q=s.getBoundingClientRect();
    l=Math.min(l,q.left);t=Math.min(t,q.top);r=Math.max(r,q.right);b=Math.max(b,q.bottom)});
  return {l:(l-rb.left)/rb.width*100, t:(t-rb.top)/rb.height*100,
          r:(r-rb.left)/rb.width*100, b:(b-rb.top)/rb.height*100};
}

/* 座席の並びと重なっている場合、いちばん近い外側（上下左右）へ押し出した座標を返す。
   座席の境界にすきま0でぴったり接する位置を返すと、丸め誤差で実際には
   1pxだけ重なって見えることがあるため、わずかな余白（GAP）を必ず残す。 */
function pushOutOfSeats(x,y,w,h,sb){
  if(!sb)return{x,y};
  if(!(x<sb.r&&x+w>sb.l&&y<sb.b&&y+h>sb.t))return{x,y};
  const GAP=1;
  const cands=[
    {x,        y:sb.t-h-GAP, d:(y+h)-sb.t},
    {x,        y:sb.b+GAP,   d:sb.b-y},
    {x:sb.l-w-GAP, y,        d:(x+w)-sb.l},
    {x:sb.r+GAP,   y,        d:sb.r-x},
  ].filter(p=>p.x>=0&&p.y>=0&&p.x<=100-w&&p.y<=100-h);
  if(!cands.length)return{x,y};
  const best=cands.reduce((a,b)=>a.d<b.d?a:b);
  return{x:best.x,y:best.y};
}

function roomItemEl(ri,c,teacher){
  // 教員側（教卓から見た図）は部屋を180度回転させた見え方になる。
  // 下から順に「黒板→教卓→1列目→…」となるよう、x・yとも反転する。データ(ri.x/ri.y)は常に生徒側基準で保持する。
  const mirrorX=v=>teacher?(100-v-ri.w):v;
  const mirrorY=v=>teacher?(100-v-ri.h):v;
  const n=el("div",{class:"ritem","data-kind":ri.kind,
    style:{left:mirrorX(ri.x)+"%",top:mirrorY(ri.y)+"%",width:ri.w+"%",height:ri.h+"%"}},
    ri.label,
    el("button",{class:"x",title:"削除",onclick:e=>{e.stopPropagation();
      const k=ctx(); if(!k)return renderEditorBody();
      pushUndo("教室備品の削除");c.room=c.room.filter(x=>x.id!==ri.id);store.save(k.t);renderEditorBody()}},"×"));
  // 重なり回避（avoidRoomOverlaps）が参照するための、データ本体と「本来置きたい画面上の位置」
  n.__ri=ri;
  n.__screen={x:mirrorX(ri.x),y:mirrorY(ri.y)};
  n.addEventListener("pointerdown",ev=>{
    if(E.mode!=="room"||ev.target.classList.contains("x"))return;
    ev.preventDefault(); const room=n.parentElement, rb=room.getBoundingClientRect();
    // 重なり回避で表示位置がずれている場合があるので、掴む基準は実際の描画位置から取る
    const nb=n.getBoundingClientRect();
    const ox=ev.clientX-nb.left, oy=ev.clientY-nb.top;
    pushUndo("教室備品の移動");
    const mv=e2=>{
      const screenX=Math.max(0,Math.min(100-ri.w,((e2.clientX-ox-rb.left)/rb.width)*100));
      const screenY=Math.max(0,Math.min(100-ri.h,((e2.clientY-oy-rb.top)/rb.height)*100));
      ri.x=mirrorX(screenX); ri.y=mirrorY(screenY);
      n.__screen={x:screenX,y:screenY};
      n.style.left=screenX+"%"; n.style.top=screenY+"%";
    };
    const up=()=>{
      document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);
      // 指を離した時点で座席と重なっていたら、いちばん近い外側へ自動で逃がす
      const cur=pushOutOfSeats(mirrorX(ri.x),mirrorY(ri.y),ri.w,ri.h,seatBoundsPct(room));
      ri.x=mirrorX(cur.x); ri.y=mirrorY(cur.y);
      n.__screen={x:cur.x,y:cur.y};
      n.style.left=cur.x+"%"; n.style.top=cur.y+"%";
      const k=ctx(); if(k)store.save(k.t);
    };
    document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);
  });
  return n;
}

/* 用紙の向きなどで座席の占有範囲が変わっても備品が重ならないよう、
   レイアウト確定のたびに表示位置だけを最寄りの外側へ逃がす（保存データは書き換えない） */
function avoidRoomOverlaps(){
  const room=document.querySelector(".room"); if(!room)return;
  const sb=seatBoundsPct(room); if(!sb)return;
  room.querySelectorAll(".ritem").forEach(n=>{
    const ri=n.__ri, base=n.__screen; if(!ri||!base)return;
    const p=pushOutOfSeats(base.x,base.y,ri.w,ri.h,sb);
    n.style.left=p.x+"%"; n.style.top=p.y+"%";
  });
}

function seatEl(s,t,c,teacher){
  const no=c.assign[s.id];
  const st=no!=null?t.roster.find(x=>x.no===no):null;
  const isFixed=(c.fixedSeats||[]).some(f=>f.seatId===s.id);
  // 教員側（教卓から見た図）は部屋全体を180度回転させた見え方になるため、列・行とも反転する
  const col=teacher?(c.layout.cols-s.col):(s.col+1);
  const row=teacher?(c.layout.rows-s.row):(s.row+1);
  const n=el("div",{class:"seat"+(!s.enabled?" off":st?"":" empty")+(isFixed?" fixed":"")+(E.sel===s.id?" sel":""),
    "data-seat":s.id,style:{gridColumn:col,gridRow:row}});
  if(!s.enabled)return n;
  if(st){
    n.append(el("span",{class:"sno",text:st.no}),
             el("span",{class:"sname",text:st.name.replace(/\s+/g,"")}),
             el("span",{class:"sromaji",text:st.romaji}));
    // 固定された座席の生徒は、ドラッグでよそへ動かせないようにする
    n.draggable=E.mode==="place"&&!isFixed;
  }
  if(isFixed)n.append(el("span",{class:"stamp",text:"固定"}));

  n.addEventListener("click",()=>{
    if(E.mode==="swap"){
      // 固定された座席は交換の対象にしない（「固定席・NGペア」タブでの固定内容と食い違うため）
      if(isFixed)return toast("固定された座席は交換できません。先に固定を解除してください");
      if(!E.sel){E.sel=s.id;renderEditorBody();return}
      if(E.sel===s.id){E.sel=null;renderEditorBody();return}
      pushUndo("座席の交換");
      const a=E.sel,b=s.id,va=c.assign[a],vb=c.assign[b];
      if(vb==null)delete c.assign[a];else c.assign[a]=vb;
      if(va==null)delete c.assign[b];else c.assign[b]=va;
      E.sel=null;store.save(t);renderEditorBody();
      const f=document.querySelector(`[data-seat="${b}"]`);f&&f.classList.add("flash");
      toast("席を交換しました");
      return;
    }
    if(E.mode==="place"&&st)dlgSeatMenu(s,st,t,c);
  });
  // ドロップ受け入れ
  n.addEventListener("dragover",e=>{if(E.mode!=="place")return;e.preventDefault();n.classList.add("drop")});
  n.addEventListener("dragleave",()=>n.classList.remove("drop"));
  n.addEventListener("drop",e=>{
    e.preventDefault();n.classList.remove("drop");
    const d=e.dataTransfer.getData("text/plain"); if(!d)return;
    const p=JSON.parse(d);
    placeStudent(p,s,t,c);
  });
  n.addEventListener("dragstart",e=>{
    if(!st)return e.preventDefault();
    e.dataTransfer.setData("text/plain",JSON.stringify({no:st.no,from:s.id}));
    n.classList.add("dragging");
  });
  n.addEventListener("dragend",()=>n.classList.remove("dragging"));
  return n;
}

function placeStudent(p,seat,t,c){
  if(!seat.enabled)return;
  // 固定された座席は、ドラッグ＆ドロップでもよそから配置できないようにする
  if((c.fixedSeats||[]).some(f=>f.seatId===seat.id)){
    toast("固定された座席には配置できません。先に固定を解除してください");
    return;
  }
  const cur=c.assign[seat.id];
  if(cur!=null&&cur!==p.no){
    const curSt=t.roster.find(x=>x.no===cur);
    modal({title:"席を入れ替えますか？",
      body:el("div",{class:"note",text:`この席には ${curSt?curSt.name:"別の生徒"} さんが配置されています。入れ替えますか？`}),
      footer:[el("button",{class:"btn",onclick:closeModal},"いいえ"),
        el("button",{class:"btn btn-primary",onclick:()=>{closeModal();commit()}},"はい、入れ替える")]});
    return;
  }
  commit();
  function commit(){
    pushUndo("生徒の配置");
    if(p.from){ // 席から席へ
      const other=c.assign[seat.id];
      delete c.assign[p.from];
      if(other!=null)c.assign[p.from]=other;   // 入れ替え
    }
    // 名前カードからの配置：元の席にいたら外す
    for(const[sid,no]of Object.entries(c.assign)) if(no===p.no&&sid!==p.from)delete c.assign[sid];
    c.assign[seat.id]=p.no;
    store.save(t);renderEditorBody();
    const f=document.querySelector(`[data-seat="${seat.id}"]`);f&&f.classList.add("flash");
  }
}

/* 固定席は「テンプレートの既定（t.fixedSeats）」と「その座席表のスナップショット（c.fixedSeats）」の
   2か所で保持している。編集画面で固定・解除したときに両方へ反映しないと、
   「固定席・NGペア」タブの座席ピッカーに現れず食い違うため、ここで必ず同期する。 */
function setSeatFixed(t,c,seatId,no,fixed){
  // 同じ席・同じ生徒の重複登録を防ぐため、いったん両方から取り除いてから入れ直す
  const drop=arr=>(arr||[]).filter(f=>f.seatId!==seatId&&f.no!==no);
  c.fixedSeats=drop(c.fixedSeats);
  t.fixedSeats=drop(t.fixedSeats);
  if(fixed){
    c.fixedSeats.push({no,seatId});
    t.fixedSeats.push({no,seatId});
  }
}

function dlgSeatMenu(s,st,t,c){
  const isFixed=(c.fixedSeats||[]).some(f=>f.seatId===s.id);
  modal({title:st.name,desc:`前から${s.row+1}列目・${s.col+1}番`,
    body:el("div",{},
      el("div",{class:"note",style:{marginBottom:"14px"},
        text:isFixed?"この席は固定されています。ランダム配置でも動きません。":"この席は固定されていません。"})),
    footer:[
      el("button",{class:"btn",onclick:closeModal},"閉じる"),
      el("button",{class:"btn",onclick:()=>{
        pushUndo("固定設定の変更");
        setSeatFixed(t,c,s.id,st.no,!isFixed);
        store.save(t);closeModal();renderEditorBody();toast(isFixed?"固定を解除しました":"この席を固定しました");
      }},isFixed?"固定を解除":"この席を固定する"),
      el("button",{class:"btn btn-danger",onclick:()=>{
        pushUndo("座席から外す");delete c.assign[s.id];
        setSeatFixed(t,c,s.id,st.no,false);
        store.save(t);closeModal();renderEditorBody();toast("名前カード一覧へ戻しました");
      }},"席から外す")]});
}

/* 固定席ではないが、すでに座席へ配置済みの生徒（＝手動で置いた分）。
   ランダム配置でこの配置を残すかどうかを選べるようにするための一覧。 */
function manualAssignments(c){
  const fixedSeatIds=new Set((c.fixedSeats||[]).map(f=>f.seatId));
  return Object.entries(c.assign||{})
    .filter(([sid])=>!fixedSeatIds.has(sid))
    .map(([seatId,no])=>({seatId,no}));
}

function dlgRandom(t,c){

  modal({title:"固定する座席・生徒はありますか？",

      el("label",{class:"check"},cbGender,el("div",{},el("b",{text:"男女交互になるよう配置"}),
        el("small",{text:"左右で隣り合う席の性別が交互になります"}))),
      el("label",{class:"check"},cbPrev,el("div",{},el("b",{text:"前回と同じ席を禁止"}),
        el("small",{text:prev?`前回：${jpDate(prev.startDate)}〜 の座席表と比較します`:"比較できる前回の座席表がありません"}))),
      el("div",{class:"note",style:{fontSize:"12.5px"},
        html:"適用順：<b>①固定席 → ②固定生徒 → ③NGペア → ④前回と同じ席禁止 → ⑤男女交互 → ⑥残りをランダム</b>。上位の条件を破ることはありません。"})),
    footer:[el("button",{class:"btn",onclick:closeModal},"キャンセル"),
