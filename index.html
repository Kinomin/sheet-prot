        const res=solve(t,c,{gender:cbGender.checked,noPrev:cbPrev.checked&&!!prev,prev,keepSeats});
        if(!res.ok){closeModal();return dlgError("条件を満たす座席配置を作成できませんでした",res.causes)}
        pushUndo("ランダム配置");
        c.assign=res.assign;store.save(t);closeModal();renderEditorBody();
        toast("ランダム配置しました");
      }},"この条件で配置する")]});
}

/* --- バックトラッキング法による配置生成 --- */
function solve(t,c,opt){
  const seats=[...c.layout.seats].filter(s=>s.enabled).sort((a,b)=>a.row-b.row||a.col-b.col);
  const roster=t.roster;
  if(roster.length>seats.length)
    return{ok:false,causes:[`名簿${roster.length}名に対して座席が${seats.length}席しかありません`,"座席レイアウトで席を追加してください"]};

  const byRC=new Map(seats.map(s=>[`${s.row}:${s.col}`,s]));
  const idxOf=new Map(seats.map((s,i)=>[s.id,i]));
  const ng=new Map();
  (c.ngPairs||t.ngPairs||[]).forEach(([a,b])=>{
    if(!ng.has(a))ng.set(a,new Set());if(!ng.has(b))ng.set(b,new Set());
    ng.get(a).add(b);ng.get(b).add(a);
  });
  const gender=new Map(roster.map(s=>[s.no,s.gender]));

  // ① 固定席・② 固定生徒
  const assign=new Array(seats.length).fill(undefined);
  const used=new Set();
  for(const f of (c.fixedSeats||[])){
    const i=idxOf.get(f.seatId);
    if(i==null)continue;
    if(!roster.some(s=>s.no===f.no))continue;
    if(assign[i]!==undefined)return{ok:false,causes:["同じ座席に複数の生徒が固定されています","「固定席・NGペア」で重複を解除してください"]};
    assign[i]=f.no;used.add(f.no);
  }
  // 「今の配置を活かして残りだけ決める」を選んだ場合の、手動配置の保持。
  // 固定席（①）と同格に扱うが、正式な固定席ではないためエラー文言は分けて出す（下記conflictOf）。
  const keptIdx=new Set();
  for(const f of (opt.keepSeats||[])){
    const i=idxOf.get(f.seatId);
    if(i==null||assign[i]!==undefined)continue;   // 固定席と重なる場合は固定席を優先
    if(!roster.some(s=>s.no===f.no)||used.has(f.no))continue;
    assign[i]=f.no;used.add(f.no);keptIdx.add(i);
  }
  const pool=roster.filter(s=>!used.has(s.no)).map(s=>s.no);
  const blanks=seats.length-roster.length;           // 空席
  const openIdx=[];for(let i=0;i<seats.length;i++)if(assign[i]===undefined)openIdx.push(i);

  function neighbors(i){
    const s=seats[i],out=[];
    [[-1,0],[1,0],[0,-1],[0,1]].forEach(([dr,dc])=>{
      const n=byRC.get(`${s.row+dr}:${s.col+dc}`);
      if(n)out.push({i:idxOf.get(n.id),lr:dc!==0});
    });
    return out;
  }
  const NB=seats.map((_,i)=>neighbors(i));

  /* 制約は優先順位つきの述語リストとして管理する。
     将来、視力配慮・支援配慮・仲良しペア等を追加する場合は、
     seat.tags / roster側のタグ等を見る述語をこのリストに1つ足すだけでよい。 */
  const SEAT_CONSTRAINTS=[   // その席単体で決まる制約（④）
    // 固定席は①で、この条件は④。上位の①が優先されるため、固定した席には④を適用しない。
    // （毎回同じ席に固定している生徒がいると、④を選んだ瞬間に全体が失敗してしまう）
    {name:"前回と同じ席禁止",
     ok:(i,no)=>isFixedIdx(i)||!(opt.noPrev&&opt.prev&&opt.prev.assign[seats[i].id]===no)},
  ];
  const PAIR_CONSTRAINTS=[   // 隣接する2席の関係で決まる制約（③⑤）
    {name:"NGペア",ok:(no,other)=>!ng.get(no)?.has(other)},
    {name:"男女交互",lrOnly:true,ok:(no,other)=>!(opt.gender&&gender.get(no)===gender.get(other))},
  ];
  function fits(i,no,checkAll){
    if(no==null)return true;
    if(!SEAT_CONSTRAINTS.every(c=>c.ok(i,no)))return false;
    for(const{i:j,lr}of NB[i]){
      const other=assign[j];
      if(other===undefined||other===null)continue;
      if(!checkAll&&j>i&&!isFixedIdx(j))continue;    // まだ確定していない席は後で判定
      for(const c of PAIR_CONSTRAINTS){
        if(c.lrOnly&&!lr)continue;
        if(!c.ok(no,other))return false;
      }
    }
    return true;
  }
  const fixedIdx=new Set();seats.forEach((s,i)=>{if(assign[i]!==undefined)fixedIdx.add(i)});
  function isFixedIdx(i){return fixedIdx.has(i)}

  /* 違反している条件の名前を返す（問題なければ null）。
     「条件に違反しています」とだけ伝えても直しようがないため、
     どの条件で・誰が・どの席かまで示す。 */
  function conflictOf(i,no){
    for(const c of SEAT_CONSTRAINTS) if(!c.ok(i,no))return c.name;
    for(const{i:j,lr}of NB[i]){
      const other=assign[j];
      if(other===undefined||other===null)continue;
      for(const c of PAIR_CONSTRAINTS){
        if(c.lrOnly&&!lr)continue;
        if(!c.ok(no,other))return c.name;
      }
    }
    return null;
  }
  const nameOfNo=no=>roster.find(s=>s.no===no)?.name??`#${no}`;

  // ①② 固定・保持した配置どうしがすでに条件へ違反していないか検査
  for(let i=0;i<seats.length;i++){
    if(assign[i]===undefined)continue;
    const why=conflictOf(i,assign[i]);
    if(!why)continue;
    const who=`${nameOfNo(assign[i])}さん（前から${seats[i].row+1}列目・${seats[i].col+1}番）`;
    if(keptIdx.has(i))return{ok:false,causes:[
      `残す指定をした配置が「${why}」の条件に違反しています`,
      `${who}を動かすか、位置を変更してください`,
      "「全員をランダムに配置し直す」を選ぶと、この配置も含めて決め直せます"]};
    return{ok:false,causes:[
      `固定した座席が「${why}」の条件に違反しています`,
      `${who}の固定内容を見直してください`,
      "「固定席・NGペア」タブから固定を解除するか、席を変更できます"]};
  }

  // ⑥ 残りをランダムに（バックトラッキング）
  const order=openIdx.slice();          // 行優先＝左と上が確定済みになり枝刈りが効く
  const ATTEMPTS=8, LIMIT=50000;
  let nodes=0;

  /* 同じ性別で、NGペアも持たない生徒どうしは「入れ替えても成立/不成立が変わらない」。
     この場合は1人を試せば十分で、まとめないと同じ形の並べ替えを何万通りも試すことになり、
     解があるのに探索を打ち切ってしまう（男18・女17の6×6で実際に起きていた）。
     「前回と同じ席を禁止」は生徒ごとに禁止される席が違い入れ替えられないため、
     その条件を使うときはまとめない。 */
  const groupable=!opt.noPrev;
  const candKey=v=>v==null?"_":(groupable&&!ng.has(v))?("g"+gender.get(v)):("u"+v);

  function bt(k,rest){
    if(++nodes>LIMIT)return"limit";
    if(k===order.length)return true;
    const i=order[k];
    const seen=new Set();
    for(let x=0;x<rest.length;x++){
      const v=rest[x];
      const key=candKey(v);
      if(seen.has(key))continue; seen.add(key);
      assign[i]=v;
      if(fits(i,v,false)){
        const r=bt(k+1,rest.slice(0,x).concat(rest.slice(x+1)));
        if(r===true)return true; if(r==="limit")return"limit";
      }
      assign[i]=undefined;
    }
    return false;
  }

  /* 打ち切りは並び順の運に左右されるため、並べ直して数回やり直す。
     解が出た場合と「解なし」と確定した場合はその時点で終える。 */
  let r=false;
  for(let attempt=0;attempt<ATTEMPTS;attempt++){
    for(const i of openIdx)assign[i]=undefined;
    nodes=0;
    r=bt(0,shuffle(pool.concat(new Array(blanks).fill(null))));
    if(r!=="limit")break;
  }
  if(r!==true){
    const causes=[];
    if((c.ngPairs||t.ngPairs||[]).length)causes.push("NGペアが多すぎて、隣り合わせを避けられません");
    if((c.fixedSeats||[]).length)causes.push("固定席が競合しています");
    if(opt.gender){
      const m=roster.filter(s=>s.gender==="m").length,f=roster.length-m;
      causes.push(`男女交互が成立しません（男 ${m}名 / 女 ${f}名）`);
    }
    if(opt.noPrev)causes.push("「前回と同じ席を禁止」を満たす配置が見つかりません");
    if(r==="limit")causes.push("条件が複雑なため、時間内に配置を作れませんでした");
    if(!causes.length)causes.push("条件の組み合わせを満たす配置が存在しません");
    causes.push("——　部分的な配置は採用していません。条件を1つ減らしてお試しください。");
    return{ok:false,causes};
  }
  const out={};
  seats.forEach((s,i)=>{if(assign[i]!=null)out[s.id]=assign[i]});
  return{ok:true,assign:out};
}

/* =====================================================================
   印刷
   ===================================================================== */
let PRINT_PREVIEW_OPEN=false;

/* 印刷ボタン／Ctrl+P の入口。実物の.sheet要素を画面中央のオーバーレイへ一時的に
   移動してプレビュー表示し、「はい、印刷する」を押したときだけ実際に印刷する。 */
function dlgPrintPreview(){
  const k=ctx(); if(!k)return; const{t}=k;
  const sheetEl=$(".sheet"); if(!sheetEl)return;
  const homeParent=sheetEl.parentElement, homeNext=sheetEl.nextSibling;

  PRINT_PREVIEW_OPEN=true;
  const previewBox=el("div",{class:"print-preview",style:{
    background:"#fff",borderRadius:"10px",padding:"18px",
    maxHeight:"76vh",maxWidth:"92vw",overflow:"auto",
    display:"flex",justifyContent:"center",alignItems:"flex-start",
    boxShadow:"0 20px 60px -20px rgba(0,0,0,.5)"
  }});
  const facingLabel=t.print.facing==="teacher"?"教員側":"生徒側";
  const titleBar=el("div",{style:{color:"#fff",fontWeight:"700",fontSize:"15px",textAlign:"center"}},
    `印刷プレビュー　${t.print.paper}・${t.print.orient==="portrait"?"縦":"横"}・${facingLabel}`);
  const okBtn=el("button",{class:"btn btn-primary btn-lg",onclick:()=>confirmPrint(okBtn)},"はい、印刷する");
  const footer=el("div",{style:{display:"flex",gap:"10px",alignItems:"center",flexWrap:"wrap",justifyContent:"center"}},
    el("button",{class:"btn btn-lg",onclick:()=>cancel()},"キャンセル"),
    okBtn,
    printQuotaNote());
  const panel=el("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:"16px"}},
    titleBar,previewBox,footer);
  const backdrop=el("div",{style:{
    position:"fixed",inset:"0",background:"rgba(22,29,41,.55)",
    display:"flex",alignItems:"center",justifyContent:"center",zIndex:"90",padding:"24px"
  }},panel);
  backdrop.addEventListener("click",e=>{if(e.target===backdrop)cancel()});

  previewBox.append(sheetEl); // 複製ではなく実物のDOMノードを移動する
  document.body.append(backdrop);

  FIT.print=true;
  requestAnimationFrame(()=>{
    fitSheet();
    // clientHeight/Width には padding が含まれる。差し引かずに使うと、
    // 用紙の下端が padding のぶんだけ枠からはみ出し、最後列がスクロールしないと見えない。
    const cs=getComputedStyle(previewBox);
    const availW=previewBox.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    const availH=previewBox.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
    const w=sheetEl.offsetWidth, h=sheetEl.offsetHeight;
    const scale=Math.min(1, availW/w, availH/h);
    if(scale<1){
      sheetEl.style.transform=`scale(${scale})`;
      sheetEl.style.transformOrigin="top center";
      // transform は配置上の大きさを変えないため、縮小した分だけ下に余白が残る。
      // その差を打ち消して、枠の中にちょうど収める。
      sheetEl.style.marginBottom=(-(h*(1-scale)))+"px";
    }else{
      sheetEl.style.transform=""; sheetEl.style.marginBottom="";
    }
    // fitSheet()内のavoidRoomOverlaps()はtransform適用前の座標をもとに計算しているため、
    // 縮小表示後の実際の描画（グリッドの丸め誤差を含む）では備品と座席がわずかに
    // 重なって見えることがある。transform適用の反映を1フレーム待ってから、
    // 実測値でもう一度だけ計算し直す（同フレーム内ではまだ古い座標が返ることがあるため）。
    requestAnimationFrame(avoidRoomOverlaps);
  });

  function onKey(e){ if(e.key==="Escape")cancel(); }
  document.addEventListener("keydown",onKey);

  function teardown(){
    sheetEl.style.transform=""; sheetEl.style.marginBottom="";
    if(homeNext)homeParent.insertBefore(sheetEl,homeNext); else homeParent.append(sheetEl);
    backdrop.remove();
    document.removeEventListener("keydown",onKey);
    PRINT_PREVIEW_OPEN=false;
  }
  function cancel(){
    teardown();
    FIT.print=false;
    requestAnimationFrame(fitSheet);
  }
  async function confirmPrint(btn){
    btn.disabled=true;
    const gate=await consumePrint();     // 無料会員は回数を消費する
    if(!gate.allowed){
      teardown(); FIT.print=false; requestAnimationFrame(fitSheet);
      dlgPrintLimit(gate);
      return;
    }
    teardown();
    doPrint();
    if(!gate.unlimited&&typeof gate.remaining==="number"){
      setTimeout(()=>toast(gate.remaining>0
        ? `無料会員の印刷はあと${gate.remaining}回です`
        : "無料会員の印刷回数を使い切りました"),400);
    }
  }
}

/* =====================================================================
   印刷回数（無料会員の上限）
   ---------------------------------------------------------------------
   回数の管理はサーバー側（consume_print）で行う。ブラウザに持たせると
   消すだけで回避できてしまうため。
   ※Webページである以上、ブラウザ自体の印刷機能を技術的に塞ぐことはできません。
     ここでの制限は、ツールの印刷ボタン経由の回数に対するものです。
   ===================================================================== */
const PRINT_LIMIT_FREE=3;

async function consumePrint(){
  if(!SB_READY())return {allowed:true,unlimited:true};
  // β版のあいだは回数を数えない（サーバー側の残数も消費しない）
  if(BETA_FREE())return {allowed:true,unlimited:true};
  if(AUTH.isPremium())return {allowed:true,unlimited:true};
  try{
    const r=await SB.rpc("consume_print");
    // 画面表示用の残り回数を合わせる
    if(r&&typeof r.used==="number"&&AUTH.account){
      AUTH.account.printCount=r.used; AUTH.persist();
    }
    return r;
  }catch(e){
    // 通信できないときは印刷を妨げない（授業の準備を止めないことを優先）
    return {allowed:true,unlimited:false,offline:true};
  }
}
/* 残り回数の案内（プレビュー内に表示） */
function printQuotaNote(){
  if(!SB_READY()||AUTH.isPremium()||BETA_FREE())return null;
  const used=AUTH.account?.printCount??0;
  const left=Math.max(0,PRINT_LIMIT_FREE-used);
  return el("div",{style:{color:"#e4e8f0",fontSize:"12.5px",width:"100%",textAlign:"center"},
    text:`無料会員の印刷はあと${left}回です（プレミアム会員は無制限）`});
}
function dlgPrintLimit(gate){
  // 上限以外の理由（会員情報を取得できなかった等）は、上限の案内を出さない
  if(gate.reason&&gate.reason!=="limit_reached"){
    return dlgError("印刷できませんでした",
      ["会員情報を確認できませんでした","通信の状態をご確認のうえ、もう一度お試しください"]);
  }
  modal({title:"無料会員の印刷回数を使い切りました",
    desc:`無料会員でご利用いただける印刷は${gate.limit??PRINT_LIMIT_FREE}回までです。`,
    body:el("div",{},
      el("div",{class:"note"},
        el("b",{text:`プレミアム会員（${APP_CONFIG.premiumPriceLabel}）`}),
        el("ul",{style:{margin:"8px 0 0 17px",lineHeight:"1.8"}},
          el("li",{text:"印刷は無制限"}),
          el("li",{text:"同じGoogleアカウントで端末をまたいでデータを引き継ぎ"}),
          )),
      el("p",{style:{marginTop:"12px",fontSize:"12.5px",color:"var(--ink2)"},
        text:"作成済みの座席表は、無料会員のままでも引き続き閲覧・編集できます。"})),
    footer:[el("button",{class:"btn",onclick:closeModal},"閉じる"),
      el("button",{class:"btn btn-primary",onclick:()=>{closeModal();dlgUpgrade({})}},"プレミアム会員に変更する")]});
}

function doPrint(){
  const k=ctx(); if(!k)return; const{t}=k;
  let st=document.getElementById("pagecss");
  if(!st){st=el("style",{id:"pagecss"});document.head.append(st)}
  st.textContent=`@page{size:${t.print.paper} ${t.print.orient};margin:8mm}`;
  FIT.print=true;fitSheet();
  setTimeout(()=>{window.print();FIT.print=false;requestAnimationFrame(fitSheet)},60);
}
window.addEventListener("afterprint",()=>{FIT.print=false;fitSheet()});

/* =====================================================================
   ルート描画
   ===================================================================== */
let _renderKey=null; // 直前と同じ画面/タブへの再描画ならスクロール位置を維持する
function render(){
  const app=$("#app");
  const prevView=$("#view");
  const scrollTop=prevView?prevView.scrollTop:0;
  const key=`${R.view}|${R.tplId}|${R.chartId}|${R.tab}`;
  const keepScroll=key===_renderKey;
  _renderKey=key;

  // 未ログインならログイン画面だけを表示する
  if(!AUTH.signedIn()){
    _renderKey=null;
    app.innerHTML="";
    app.append(el("div",{class:"view",id:"view"}));
    $("#view").append(viewLogin());
    return;
  }

  const t=R.tplId?store.get(R.tplId):null;
  const c=t&&R.chartId?t.charts.find(x=>x.id===R.chartId):null;

  const crumb=el("div",{class:"crumb"},
    el("button",{class:"btn btn-sm",onclick:()=>go({view:"home",tplId:null,chartId:null})},"ホーム"),
    t?el("span",{class:"sep",text:"›"}):null,
    t?el("button",{class:"btn btn-sm",onclick:()=>go({view:"tpl",chartId:null})},titleOf(t)):null,
    c?el("span",{class:"sep",text:"›"}):null,
    c?el("b",{text:jpDate(c.startDate)+"〜"}):null);

  app.innerHTML="";
  app.append(
    el("div",{class:"topbar no-print"},
      el("div",{class:"brand"},el("span",{class:"mark"}),"席メイト"),
      el("div",{class:"div",style:{width:"1px",height:"24px",background:"var(--line)"}}),
      crumb, el("div",{class:"spacer"}),
      el("span",{class:"chip chip-g beta-chip",text:"β版"}),
      (AUTH.isPremium()&&!BETA_FREE())?el("span",{class:"chip chip-a",text:"プレミアム"}):null,
      gearButton()),
    el("div",{class:"view",id:"view"}));

  const v=$("#view");
  if(R.view==="home")v.append(viewHome());
  else if(R.view==="tpl")v.append(viewTemplate());
  else if(R.view==="edit"){
    if(E.chartId!==R.chartId){E.chartId=R.chartId;E.undo=[];E.redo=[];E.mode="place";E.sel=null;E.q="";E.unplacedOnly=false}
    v.style.overflow="hidden";
    v.append(viewEditor());
    renderEditorBody();
  }
  if(keepScroll)v.scrollTop=scrollTop;
}

/* ---- キーボード ---- */
document.addEventListener("keydown",e=>{
  if(R.view!=="edit")return;
  if(PRINT_PREVIEW_OPEN)return; // プレビュー中はdlgPrintPreview専用のEscハンドラのみ有効
  const inField=/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"");
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"&&!e.shiftKey){e.preventDefault();doUndo()}
  else if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==="y"||(e.shiftKey&&e.key.toLowerCase()==="z"))){e.preventDefault();doRedo()}
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="p"){e.preventDefault();dlgPrintPreview()}
  else if(e.key==="Escape"){
    if($("#layer").innerHTML)closeModal();
    else if(E.mode!=="place"){E.mode="place";E.sel=null;renderEditorBody()}
  }
  // 「S」で交換モード。ダイアログを開いている間や Ctrl+S（ブラウザの保存）では反応させない
  else if(!inField&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!$("#layer").innerHTML
          &&e.key.toLowerCase()==="s"){
    E.mode=E.mode==="swap"?"place":"swap";E.sel=null;renderEditorBody();
  }
});

/* =====================================================================
   起動
   ===================================================================== */
/* 決済から戻ったとき、webhookの反映を少し待ってから会員種別を取り直す。
   webhookは通常すぐ届くが、数秒遅れることがあるため何度か確認する。 */
async function settleCheckoutReturn(result){
  if(result==="cancel"){ toast("お申し込みを中止しました"); return }
  if(result!=="success")return;
  toast("お支払いを確認しています…");
  for(let i=0;i<6;i++){
    const plan=await AUTH.refreshPlanFromServer();
    if(plan==="premium"){ render(); toast("プレミアム会員になりました。ありがとうございます"); return }
    await new Promise(r=>setTimeout(r,1500));
  }
  render();
  toast("お支払いの反映に時間がかかっています。数分後に再度ご確認ください");
}

async function boot(){
  AUTH.load();
  const checkout=consumeCheckoutReturn();

  if(SB_READY()){
    // ログイン画面から戻ってきた直後ならセッションを取り込む
    const redirectResult=SB.captureRedirect();
    const justLoggedIn=redirectResult==="ok";
    if(!SB.session)SB.loadSession();

    if(SB.session){
      const user=await SB.getUser();
      if(user){
        const profile=await SB.fetchProfile();
        AUTH.applyServer(user,profile);
      }else{
        AUTH.signOut();          // セッションが無効になっていた
      }
    }else{
      AUTH.signOut();            // セッションがなければログイン画面へ
    }

    await store.load();
    // β版のあいだは、初回だけお試し用のサンプルを用意する
    const seeded=AUTH.signedIn()&&ensureSampleTemplate();
    render();
    if(seeded)toast("お試し用のサンプルを1つ用意しました（不要なら削除できます）");

    if(AUTH.signedIn()&&SYNC.available()){
      // ログイン直後はSupabaseからGoogleのトークンを受け取っているため確認画面は出ない
      await SYNC.run({quiet:true});
      render();
      if(SYNC.state==="needsAction"){
        toast("設定メニューの「今すぐ同期」を押すと、他の端末のデータを読み込めます");
      }
    }
    if(redirectResult==="error"){
      // 同意しなかった場合など。何も起きないように見えるのを避ける
      try{ sessionStorage.removeItem("seat-chart-intent") }catch(e){}
      dlgError("ログインできませんでした",
        [SB.lastError||"Googleのログインが完了しませんでした","もう一度お試しください"]);
    }else if(justLoggedIn){
      let intent="free";
      try{ intent=sessionStorage.getItem("seat-chart-intent")||"free";
           sessionStorage.removeItem("seat-chart-intent") }catch(e){}
      if(intent==="premium"&&!AUTH.isPremium()&&!BETA_FREE())dlgUpgrade({fromLogin:true});
      else toast("ログインしました");
    }
  }else{
    // 接続先が未設定のときは、古いログイン状態を残さずログイン画面を出す
    AUTH.signOut();
    await store.load();
    render();
  }

  if(checkout)await settleCheckoutReturn(checkout);
}
boot();
